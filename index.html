<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ArtesanoAI 🪵</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#FAF8F5;color:#1C1917;min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#D6D0C8;border-radius:3px}
input,select,textarea{font-family:inherit;font-size:13px;color:#1C1917;border:1px solid #E2DDD8;border-radius:8px;padding:9px 12px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:#8B5E3C;box-shadow:0 0 0 3px rgba(139,94,60,.12)}
button{cursor:pointer;font-family:inherit;transition:all .15s}
button:active{transform:scale(.97)}

.page{max-width:860px;margin:0 auto;padding:1.5rem 1.25rem 5rem}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(250,248,245,.95);backdrop-filter:blur(12px);border-bottom:1px solid #EDE9E3}
.nav-inner{max-width:860px;margin:0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem}
.logo{display:flex;align-items:center;gap:8px}
.logo-text{font-size:17px;font-weight:700;color:#1C1917}
.logo-sub{font-size:11px;color:#8B7355}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;font-weight:600;font-size:14px;padding:11px 22px;cursor:pointer;border:none;transition:all .15s}
.btn-brown{background:linear-gradient(135deg,#8B5E3C,#6B4423);color:#fff;box-shadow:0 2px 10px rgba(139,94,60,.3);width:100%}
.btn-brown:hover{opacity:.9}
.btn-brown:disabled{opacity:.38;cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline-brown{background:transparent;border:1.5px solid #8B5E3C;color:#8B5E3C;border-radius:8px;padding:7px 16px;font-size:12px;font-weight:600}
.btn-outline-brown:hover{background:rgba(139,94,60,.07)}
.btn-ghost{background:none;border:none;color:#8B7355;font-size:13px;padding:6px 12px;border-radius:6px}
.btn-ghost:hover{background:#F0EBE3}
.btn-copy{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid #E2DDD8;background:#FAF8F5;color:#6B6460;white-space:nowrap}
.btn-copy:hover{background:#F0EBE3}
.btn-copy.ok{background:#D4EDDA;border-color:#A8D5B5;color:#2D6A4F}
.btn-copy-lg{font-size:13px;padding:9px 20px;border-radius:8px;border:1.5px solid #8B5E3C;background:rgba(139,94,60,.07);color:#5C3D1E;font-weight:600}
.btn-copy-lg:hover{background:rgba(139,94,60,.14)}
.btn-copy-lg.ok{background:#D4EDDA;border-color:#A8D5B5;color:#2D6A4F}
.api-btn-ok{font-size:12px;padding:7px 14px;border-radius:8px;border:1px solid #2D6A4F;background:#D4EDDA;color:#2D6A4F;font-weight:600}
.api-btn-no{font-size:12px;padding:7px 14px;border-radius:8px;border:1px solid #E2DDD8;background:#FAF8F5;color:#8B7355;font-weight:500}

/* CARDS */
.card{background:#fff;border:1px solid #EDE9E3;border-radius:14px;padding:1.25rem}
.card-warm{background:#F5F0EB;border:1px solid #EDE9E3;border-radius:14px;padding:1.25rem}
.card-ml{background:#fff;border:2px solid #FFD100;border-radius:14px;padding:1.5rem}
.card-highlight{background:#fff;border:2px solid #8B5E3C;border-radius:14px;padding:1.25rem}

/* SECTION STEPS (big numbered) */
.section-step{display:flex;gap:16px;margin-bottom:1.75rem;align-items:flex-start}
.step-num{min-width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#8B5E3C,#6B4423);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;margin-top:2px}
.step-body{flex:1}
.step-title{font-size:16px;font-weight:700;margin-bottom:4px;color:#1C1917}
.step-desc{font-size:13px;color:#8B7355;margin-bottom:12px;line-height:1.55}

/* UPLOAD */
.upload-zone{border:2px dashed #D6D0C8;border-radius:14px;padding:2.5rem 2rem;text-align:center;cursor:pointer;background:#FDFCFB;transition:all .2s}
.upload-zone:hover,.upload-zone.drag{border-color:#8B5E3C;background:rgba(139,94,60,.04)}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid #EDE9E3}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.thumb-num{position:absolute;top:5px;left:7px;font-size:10px;color:#fff;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.thumb-del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:11px;line-height:20px;text-align:center;padding:0}
.thumb-del:hover{background:rgba(200,30,30,.85)}
.thumb-add{aspect-ratio:1;border-radius:10px;border:1.5px dashed #D6D0C8;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#C9B9A8;font-size:28px;background:#FDFCFB}
.thumb-add:hover{border-color:#8B5E3C;color:#8B5E3C;background:rgba(139,94,60,.04)}

/* PHOTO STYLE SELECTOR */
.style-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.style-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid #EDE9E3;background:#FDFCFB;cursor:pointer;text-align:left;width:100%}
.style-btn:hover{border-color:#C9B9A8;background:#F5F0EB}
.style-btn.on{border:2px solid #8B5E3C;background:rgba(139,94,60,.06)}

/* PROGRESS */
.prog-wrap{background:#EDE9E3;border-radius:8px;height:8px;overflow:hidden;max-width:480px;margin:0 auto}
.prog-bar{height:100%;background:linear-gradient(90deg,#8B5E3C,#C4845A);border-radius:8px;transition:width .8s ease}

/* TABS */
.tabs{display:flex;gap:2px;border-bottom:1px solid #EDE9E3;margin-bottom:1.5rem;overflow-x:auto}
.tab{font-size:13px;padding:9px 15px;border-radius:6px 6px 0 0;border:none;border-bottom:2px solid transparent;background:transparent;color:#8B7355;font-weight:400;cursor:pointer;white-space:nowrap}
.tab.active{color:#8B5E3C;font-weight:700;border-bottom-color:#8B5E3C}
.tab:hover:not(.active){background:#F5F0EB;color:#5C3D1E}

/* PLATFORM LIST */
.plat-layout{display:grid;grid-template-columns:195px 1fr;gap:1.5rem}
.plat-list{display:flex;flex-direction:column;gap:4px}
.plat-btn{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;border:1px solid #EDE9E3;background:#fff;cursor:pointer;text-align:left;width:100%}
.plat-btn:hover{background:#F5F0EB;border-color:#C9B9A8}
.plat-btn.active{border-width:1.5px}
.field-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;border:1px solid #EDE9E3;background:#FAF8F5;cursor:pointer;gap:10px}
.field-row:hover{background:#F0EBE3;border-color:#C9B9A8}
.field-row.active{border:1.5px solid #8B5E3C;background:rgba(139,94,60,.04)}

/* MISC */
.tag{font-size:12px;padding:4px 10px;border-radius:20px;background:#F5F0EB;border:1px solid #EDE9E3;color:#5C3D1E;display:inline-block}
.tag-brown{background:rgba(139,94,60,.08);border-color:rgba(139,94,60,.25);color:#5C3D1E}
.badge-ok{font-size:11px;padding:3px 10px;border-radius:20px;background:#D4EDDA;color:#2D6A4F;font-weight:600}
.badge-ai{font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(139,94,60,.1);border:1px solid rgba(139,94,60,.2);color:#8B5E3C;font-weight:600}
.slbl{font-size:11px;color:#A89880;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.divider{height:1px;background:#EDE9E3;margin:1.25rem 0}
.ml-tip{background:#FFF9D6;border:1px solid #FFD100;border-radius:8px;padding:10px 14px;font-size:12px;color:#7A5C00;line-height:1.6;margin-bottom:1.25rem}
.prompt-box{background:#F5F0EB;border-radius:8px;padding:12px 14px;font-family:monospace;font-size:12px;color:#5C3D1E;line-height:1.7}
.improve-chip{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid #EDE9E3;background:#fff;color:#5C3D1E;cursor:pointer}
.improve-chip:hover,.improve-chip.on{background:rgba(139,94,60,.08);border-color:#8B5E3C}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:pointer}
.lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:10px}
.footer{text-align:center;padding:2rem 0 1rem;font-size:12px;color:#C9B9A8;border-top:1px solid #EDE9E3;margin-top:3rem}
.footer a{color:#8B7355;text-decoration:none}
.char-ok{font-size:11px;color:#2D6A4F;margin-top:4px}
.char-warn{font-size:11px;color:#C0392B;margin-top:4px}
.ai-glow{border-left:3px solid #8B5E3C;padding-left:10px;border-radius:0 8px 8px 0;background:rgba(139,94,60,.03)}

@media(max-width:600px){
  .plat-layout{grid-template-columns:1fr}
  .photo-grid{grid-template-columns:repeat(3,1fr)}
  .style-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

  <div class="nav-inner">
    <div class="logo">

</nav>

<script type="text/babel">
const { useState, useRef } = React;

/* ── Constants ── */
const PLATFORMS = [
  {id:"mercadolibre",name:"MercadoLibre Ecuador",icon:"🛒",color:"#FFD100",region:"Ecuador/LatAm",lang:"es"},
  {id:"etsy",        name:"Etsy",                icon:"🛍️",color:"#F1641E",region:"Global",      lang:"en"},
  {id:"amazon",      name:"Amazon Handmade",     icon:"📦",color:"#FF9900",region:"Global",      lang:"en"},
  {id:"instagram",   name:"Instagram Shop",      icon:"📸",color:"#E1306C",region:"Global",      lang:"en"},

  {id:"tiktok",      name:"TikTok",              icon:"🎵",color:"#333",   region:"LatAm",       lang:"es"},
  {id:"shopify",     name:"Shopify",             icon:"🏪",color:"#96BF48",region:"Global",      lang:"en"},
  {id:"ecuadorshops",name:"EcuadorShops",        icon:"🇪🇨",color:"#003580",region:"Ecuador",     lang:"es"},
  {id:"whatsapp",    name:"WhatsApp Business",   icon:"💬",color:"#25D366",region:"LatAm",       lang:"es"},
  {id:"pinterest",   name:"Pinterest",           icon:"📌",color:"#E60023",region:"Global",      lang:"en"},
];

const PF = {
  mercadolibre:["titulo","descripcion","atributos","categoria","condicion","palabrasClave","notaEnvio","mensajeVendedor"],
  etsy:        ["title","description","tags","materials","shippingNote"],
  amazon:      ["title","bulletPoints","description","searchTerms"],
  instagram:   ["caption","storyText","reelsHook"],
  facebook:    ["title","description","boostSuggestion"],
  tiktok:      ["hook","script","caption"],

  ecuadorshops:["title","description","shippingNote"],
  whatsapp:    ["catalogTitle","catalogDescription","promoMessage"],
  pinterest:   ["title","description","boardSuggestion"],
};

const FL = {
  titulo:"Título",descripcion:"Descripción",atributos:"Atributos",categoria:"Categoría",
  condicion:"Condición",palabrasClave:"Palabras clave",notaEnvio:"Nota de envío",
  mensajeVendedor:"Mensaje al comprador",title:"Title",description:"Description",
  tags:"Tags",materials:"Materials",shippingNote:"Shipping note",bulletPoints:"Bullet points",
  searchTerms:"Search terms",caption:"Caption",storyText:"Story text",reelsHook:"Reels hook",
  boostSuggestion:"Boost suggestion",hook:"Hook",script:"Script",metaDescription:"Meta description",
  productDescription:"Product description",catalogTitle:"Catalog title",
  catalogDescription:"Catalog description",promoMessage:"Promo message",boardSuggestion:"Board suggestion",
};

const PHOTO_STYLES = [
  {id:"hero",     icon:"⬜",label:"Foto principal",   desc:"Fondo blanco, luz de estudio"},
  {id:"lifestyle",icon:"🏠",label:"Estilo de vida",   desc:"Hogar cálido ecuatoriano"},
  {id:"detail",   icon:"🔍",label:"Detalle macro",    desc:"Grano de madera extremo"},
  {id:"scale",    icon:"📐",label:"Escala",           desc:"Prop para mostrar tamaño"},
  {id:"flatlay",  icon:"🪴",label:"Flat lay",         desc:"Vista aérea, props mínimos"},
  {id:"dramatic", icon:"🎭",label:"Luz dramática",    desc:"Estudio oscuro, claroscuro"},
  {id:"outdoor",  icon:"🌿",label:"Exterior natural", desc:"Bosque nublado, luz dorada"},
  {id:"gift",     icon:"🎁",label:"Empaque regalo",   desc:"Unboxing premium artesanal"},
];

const IMPROVE_TONES = [
  "Más lujoso","Más emocional","Corto y directo","Historia Ecuador",
  "Resaltar madera","Ángulo ecológico","Más SEO","More luxurious","More keywords",
];

async function callClaude(key, messages, maxTokens=4000) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens,messages})
  });
  const d = await res.json();
  if(d.error) throw new Error(d.error.message);
  return d.content?.map(i=>i.text||"").join("")||"";
}

/* ── App ── */
function App() {
  const [apiKey,    setApiKey]    = useState(localStorage.getItem("aai_key")||"");
  const [apiSaved,  setApiSaved]  = useState(!!localStorage.getItem("aai_key"));
  const [showApi,   setShowApi]   = useState(false);

  // Step 1: photos
  const [images,    setImages]    = useState([]);
  // Step 2: brief description + photo styles
  const [brief,     setBrief]     = useState("");
  const [selStyles, setSelStyles] = useState(["hero","lifestyle","detail","scale","flatlay"]);
  // Step 3: product details
  const [details,   setDetails]   = useState({name:"",material:"",finish:"",width:"",height:"",depth:"",price:"",notes:""});

  const [phase,     setPhase]     = useState("s1"); // s1 s2 s3 generating results
  const [progress,  setProgress]  = useState(0);
  const [progMsg,   setProgMsg]   = useState("");
  const [results,   setResults]   = useState(null);
  const [photoPrompts,setPhotoPrompts] = useState([]);

  // Results UI
  const [activeTab, setActiveTab] = useState("photos");
  const [selPlat,   setSelPlat]   = useState("mercadolibre");
  const [prevField, setPrevField] = useState("titulo");
  const [copied,    setCopied]    = useState(null);
  const [improved,  setImproved]  = useState({});
  const [improving, setImproving] = useState(false);
  const [impOpts,   setImpOpts]   = useState([]);
  const [lightbox,  setLightbox]  = useState(null);

  const fileRef = useRef();

  const saveKey = () => {
    const k = apiKey.trim();
    if(k.startsWith("sk-")){localStorage.setItem("aai_key",k);setApiSaved(true);setShowApi(false);}
  };

  const addFiles = files => {
    Array.from(files).slice(0,8-images.length).forEach(file=>{
      const url = URL.createObjectURL(file);
      const reader = new FileReader();
      reader.onload = e => {
        const b64 = e.target.result.split(",")[1];
        setImages(prev=>[...prev,{url,b64,mime:file.type||"image/jpeg"}]);
      };
      reader.readAsDataURL(file);
    });
  };

  const toggleStyle = id => setSelStyles(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);

  const buildPhotoPrompts = () => {
    const n = details.name||"artesanía en madera";
    const m = details.material||"madera";
    const f = details.finish||"natural";
    const dim = `${details.width||"?"}An × ${details.height||"?"}Al × ${details.depth||"?"}P cm`;
    const b = brief ? ` (${brief})` : "";
    const map = {
      hero:`Fotografía comercial profesional de ${n}${b}, elaborada en ${m} con acabado ${f}, dimensiones ${dim}. Fondo blanco infinito perfecto, iluminación suave de estudio a 45°, balance de blancos impecable, foco nítido en toda la pieza, calidad Hasselblad 8K, fotorrealista, sin fondo`,
      lifestyle:`${n}${b} en ${m} con acabado ${f} colocada en un hogar ecuatoriano de lujo — estantes de madera envejecida, textiles artesanales tejidos, luz cálida de tarde entrando por ventana de madera, fotografía editorial lifestyle, Sony A7R V 50mm f/1.4, fotorrealista`,
      detail:`Macro extremo del grano de ${m} y el acabado ${f} en ${n}${b}, revelando marcas de herramienta a mano y fibras naturales únicas, luz rasante dramática lateral, Nikon Z9 100mm f/2.8 macro, ampliación 1:1, ultra nítido, fondo desenfocado, fotorrealista`,
      scale:`${n}${b} (${dim}) sobre una losa de mármol pulido blanco, una calla blanca elegante a su lado como referencia de escala, fondo blanco puro, perspectiva cenital, fotografía comercial e-commerce, 8K fotorrealista`,
      flatlay:`Vista cenital de ${n}${b} estilizada con paja toquilla ecuatoriana, lino natural crudo, una tarjeta artesanal kraft y pétalos de rosa seca sobre superficie de cemento pulido, fotografía editorial lujo, iluminación difusa uniforme perfecta`,
      dramatic:`${n}${b} iluminada con único foco duro contra fondo negro mate absoluto, sombras profundas chiaroscuro revelando cada detalle de la superficie, fotografía de arte museística, Leica S3, mood cinematográfico dramático, ultra alta definición`,
      outdoor:`${n}${b} apoyada en roca volcánica musgosa en bosque nublado ecuatoriano andino, luz dorada del atardecer filtrada por el dosel del bosque, niebla suave de fondo, Canon EOS R5 85mm f/1.2 L, bokeh verde exuberante, fotorrealista`,
      gift:`${n}${b} dentro de caja de regalo kraft premium abierta, papel de seda marfil, lazo de rafia natural anudado a mano, mesa de nogal cálido, flores secas decorativas, fotografía editorial de regalo de lujo premium, fotorrealista`,
    };
    return selStyles.map(id=>({style:PHOTO_STYLES.find(x=>x.id===id),prompt:map[id]})).filter(x=>x.style);
  };

  const generate = async () => {
    if(!apiSaved){setShowApi(true);return;}
    if(!images.length){alert("Sube al menos una foto.");return;}
    setPhase("generating");setProgress(5);setProgMsg("Analizando tus fotos del producto…");

    const steps=[
      {p:18,m:"Entendiendo los detalles artesanales…"},
      {p:33,m:"Escribiendo listado para MercadoLibre Ecuador…"},
      {p:48,m:"Creando contenido para Etsy y Amazon…"},
      {p:62,m:"Generando captions para Instagram y TikTok…"},
      {p:76,m:"Construyendo palabras clave SEO bilingüe…"},
      {p:88,m:"Finalizando WhatsApp, Pinterest y Shopify…"},
    ];
    let si=0;
    const iv=setInterval(()=>{if(si<steps.length){setProgress(steps[si].p);setProgMsg(steps[si].m);si++;}},1300);

    const prompt=`Eres el mejor copywriter del mundo para artesanías de madera de lujo de Ecuador, especializado en MercadoLibre Ecuador y mercados premium globales. Precio: $${details.price||"?"} USD — debes justificar precio premium.

Producto: "${details.name||"artesanía en madera"}"
Descripción breve del vendedor: "${brief||"artesanía de madera hecha a mano"}"
Dimensiones: ${details.width||"?"}An × ${details.height||"?"}Al × ${details.depth||"?"}P cm
Madera: ${details.material||"madera"}
Acabado: ${details.finish||"natural"}
Notas adicionales: ${details.notes||"ninguna"}
Fotos analizadas: ${images.length}

REGLAS CRÍTICAS para MercadoLibre Ecuador:
- titulo: MÁXIMO 60 caracteres, palabras clave al inicio, sin símbolos especiales
- descripcion: usa exactamente este formato con emojis y secciones
- atributos: lista con formato "Clave: Valor"
- Todo en español ecuatoriano natural

Responde SOLO con JSON válido, sin markdown, sin texto extra:
{
  "productName":{"en":"...","es":"..."},
  "tagline":{"en":"...","es":"..."},
  "seoTitle":{"en":"...","es":"..."},
  "seoKeywords":{"en":["k1","k2","k3","k4","k5","k6","k7","k8","k9","k10"],"es":["k1","k2","k3","k4","k5","k6","k7","k8","k9","k10"]},
  "hashtags":{"instagram":["#t1","#t2","#t3","#t4","#t5","#t6","#t7","#t8","#t9","#t10"],"tiktok":["#t1","#t2","#t3","#t4","#t5"]},
  "instagramBio":"...",
  "pricingNote":"...",
  "platforms":{
    "mercadolibre":{

                    <div key={f} style={{border:"1px solid #EDE9E3",borderRadius:10,padding:"1rem 1.25rem",marginBottom:10,background:"#FDFCFB"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:tip?6:8}}>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <span style={{fontWeight:700,fontSize:13}}>{label}</span>
                          {hasImp&&<span className="badge-ai">✨ mejorado</span>}
                        </div>
                        <CopyBtn text={Array.isArray(val)?val.join("\n"):val} id={`ml-${f}`} small/>
                      </div>
                      {tip&&<p style={{fontSize:11,color:"#8B7355",marginBottom:8}}>💡 {tip}</p>}
                      <div className={hasImp?"ai-glow":""}>{renderVal(f,val)}</div>
                      {f==="titulo"&&val&&(
                        <p className={String(val).length>60?"char-warn":"char-ok"} style={{marginTop:6}}>
                          {String(val).length}/60 caracteres {String(val).length>60?"⚠️ Demasiado largo — acorta":"✓ Longitud correcta"}
                        </p>
                      )}
                    </div>
                  );
                })}

                {/* AI Improve */}
                <div className="card" style={{marginTop:"1.5rem"}}>
                  <p style={{fontWeight:700,fontSize:14,marginBottom:6}}>✨ Mejorar campo con IA</p>
                  <p style={{fontSize:12,color:"#8B7355",marginBottom:10}}>Selecciona el campo y el tono deseado, luego haz clic en mejorar.</p>
                  <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:8,marginBottom:10}}>
                    <select value={prevField||"titulo"} onChange={e=>setPrevField(e.target.value)}>
                      {(PF.mercadolibre||[]).map(f=><option key={f} value={f}>{FL[f]||f}</option>)}
                    </select>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
                    {IMPROVE_TONES.map(t=>(
                      <button key={t} className={`improve-chip${impOpts.includes(t)?" on":""}`} onClick={()=>setImpOpts(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t])}>{t}</button>
                    ))}
                  </div>
                  <button className="btn btn-brown" disabled={improving} onClick={()=>improveField("mercadolibre",prevField||"titulo")}>
                    {improving?"Mejorando…":"✨ Mejorar campo seleccionado"}
                  </button>
                  {Object.keys(improved).some(k=>k.startsWith("mercadolibre_"))&&(
                    <button className="btn-ghost" style={{width:"100%",marginTop:8,fontSize:12}} onClick={()=>setImproved(p=>{const n={...p};Object.keys(n).filter(k=>k.startsWith("mercadolibre_")).forEach(k=>delete n[k]);return n;})}>Revertir todas las mejoras</button>
                  )}
                </div>
              </div>
            )}

            {/* ── OTHER PLATFORMS TAB ── */}
            {activeTab==="platforms"&&(
              <div className="plat-layout">
                <div>
                  <p className="slbl" style={{marginBottom:8}}>Plataformas</p>
                  <div className="plat-list">
                    {PLATFORMS.filter(p=>p.id!=="mercadolibre").map(p=>(
                      <button key={p.id} className={`plat-btn${selPlat===p.id?" active":""}`}
                        style={selPlat===p.id?{borderColor:p.color,background:p.color+"14"}:{}}
                        onClick={()=>{setSelPlat(p.id);setPrevField(PF[p.id]?.[0]);setImpOpts([]);}}>
                        <span style={{fontSize:15}}>{p.icon}</span>
                        <div style={{flex:1,minWidth:0}}>
                          <p style={{margin:0,fontSize:12,fontWeight:selPlat===p.id?600:400,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</p>
                          <p style={{margin:0,fontSize:10,color:"#A89880"}}>{p.region} · {p.lang==="es"?"ES":"EN"}</p>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                {plat&&selPlat!=="mercadolibre"&&(
                  <div style={{minWidth:0}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"0.75rem"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{fontSize:20}}>{curPlat?.icon}</span>
                        <div>
                          <p style={{fontWeight:700,fontSize:14,margin:0}}>{curPlat?.name}</p>
                          <p style={{fontSize:11,color:"#A89880",margin:0}}>{curPlat?.lang==="es"?"En español":"In English"}</p>
                        </div>
                      </div>
                      <CopyBtn lg text={fields.map(f=>`=== ${(FL[f]||f).toUpperCase()} ===\n${Array.isArray(plat[f])?plat[f].join("\n"):plat[f]||""}`).join("\n\n")} id="p-all"/>
                    </div>

                    <div style={{marginBottom:"0.75rem"}}>
                      <label className="slbl" style={{display:"block",marginBottom:4}}>Campo</label>
                      <select value={prevField||""} onChange={e=>{setPrevField(e.target.value);setImpOpts([]);}}>
                        {fields.map(f=><option key={f} value={f}>{FL[f]||f}</option>)}
                      </select>
                    </div>

                    {prevField&&(
                      <div className="card" style={{marginBottom:"1rem"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"0.75rem"}}>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <p style={{fontWeight:700,fontSize:13,margin:0}}>{FL[prevField]||prevField}</p>
                            {improved[`${selPlat}_${prevField}`]&&<span className="badge-ai">✨ mejorado</span>}
                          </div>
                          <CopyBtn text={Array.isArray(getVal(selPlat,prevField))?getVal(selPlat,prevField).join(prevField==="bulletPoints"?"\n":", "):getVal(selPlat,prevField)} id={`${selPlat}-${prevField}`}/>
                        </div>
                        <div className={improved[`${selPlat}_${prevField}`]?"ai-glow":""}>{renderVal(prevField,getVal(selPlat,prevField))}</div>
                        <div style={{marginTop:"1rem",paddingTop:"1rem",borderTop:"1px solid #EDE9E3"}}>
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                            <p style={{fontSize:12,fontWeight:700,color:"#5C3D1E",margin:0}}>✨ Mejorar con IA</p>
                            {improved[`${selPlat}_${prevField}`]&&<button className="btn-ghost" style={{fontSize:11}} onClick={()=>setImproved(p=>{const n={...p};delete n[`${selPlat}_${prevField}`];return n;})}>Revertir</button>}
                          </div>
                          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
                            {IMPROVE_TONES.map(t=>(
                              <button key={t} className={`improve-chip${impOpts.includes(t)?" on":""}`} onClick={()=>setImpOpts(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t])}>{t}</button>
                            ))}
                          </div>
                          <button className="btn btn-brown" disabled={improving} onClick={()=>improveField(selPlat,prevField)}>
                            {improving?"Mejorando…":"✨ Mejorar este campo"}
                          </button>
                        </div>
                      </div>
                    )}

                    <div className="divider"/>
                    <p className="slbl" style={{marginBottom:8}}>Todos los campos</p>
                    <div style={{display:"flex",flexDirection:"column",gap:6}}>
                      {fields.map(f=>{
                        const val=getVal(selPlat,f);if(!val)return null;
                        const prev=Array.isArray(val)?val.slice(0,2).join(", ")+(val.length>2?"…":""):String(val).slice(0,70)+(String(val).length>70?"…":"");
                        return(
                          <button key={f} className={`field-row${prevField===f?" active":""}`} onClick={()=>setPrevField(f)}>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                                <p className="slbl" style={{margin:0}}>{FL[f]||f}</p>
                                {improved[`${selPlat}_${f}`]&&<span className="badge-ai" style={{fontSize:9}}>✨</span>}
                              </div>
                              <p style={{margin:0,fontSize:12,color:"#8B7355",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{prev}</p>
                            </div>
                            <CopyBtn text={Array.isArray(val)?val.join(", "):val} id={`m-${f}`} small/>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ── SEO TAB ── */}
            {activeTab==="seo"&&(
              <div style={{display:"grid",gap:"1rem"}}>
                {["es","en"].map(l=>(
                  <div key={l} className="card">
                    <p style={{fontWeight:700,fontSize:14,marginBottom:"1rem"}}>{l==="es"?"🇪🇨 Español":"🇺🇸 English"}</p>
                    <div style={{marginBottom:"1rem"}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                        <span className="slbl">Título SEO</span>
                        <CopyBtn text={results.seoTitle?.[l]} id={`st-${l}`} small/>
                      </div>
                      <p style={{margin:0,fontSize:13,background:"#F5F0EB",padding:"9px 12px",borderRadius:8}}>{results.seoTitle?.[l]}</p>
                    </div>
                    <div>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                        <span className="slbl">Palabras clave</span>
                        <CopyBtn text={results.seoKeywords?.[l]?.join(", ")} id={`sk-${l}`} small/>
                      </div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                        {results.seoKeywords?.[l]?.map((k,i)=><span key={i} className="tag tag-brown">{k}</span>)}
                      </div>
                    </div>
                  </div>
                ))}
                {results.pricingNote&&(
                  <div className="card">
                    <p className="slbl" style={{marginBottom:6}}>Justificación de precio premium</p>
                    <p style={{margin:0,fontSize:13,color:"#5C3D1E",lineHeight:1.65}}>{results.pricingNote}</p>
                  </div>
                )}
              </div>
            )}

            {/* ── HASHTAGS TAB ── */}
            {activeTab==="hashtags"&&(
              <div style={{display:"grid",gap:"1rem"}}>
                {[{k:"instagram",label:"📸 Instagram",color:"#E1306C"},{k:"tiktok",label:"🎵 TikTok",color:"#333"}].map(sh=>(
                  <div key={sh.k} className="card">
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}>
                      <p style={{fontWeight:700,fontSize:14,margin:0}}>{sh.label}</p>
                      <CopyBtn text={results.hashtags?.[sh.k]?.join(" ")} id={`h-${sh.k}`} small/>
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {results.hashtags?.[sh.k]?.map((h,i)=><span key={i} style={{fontSize:12,padding:"4px 10px",borderRadius:20,background:sh.color+"12",border:`1px solid ${sh.color}33`}}>{h}</span>)}
                    </div>
                  </div>
                ))}
                {results.instagramBio&&(
                  <div className="card">
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
                      <p style={{fontWeight:700,fontSize:14,margin:0}}>Bio de Instagram</p>
                      <CopyBtn text={results.instagramBio} id="bio" small/>
                    </div>
                    <p style={{margin:0,fontSize:13,color:"#5C3D1E",background:"#F5F0EB",padding:"9px 12px",borderRadius:8}}>{results.instagramBio}</p>
                  </div>
                )}
              </div>
            )}

            <div style={{textAlign:"center",marginTop:"2.5rem",paddingTop:"1.5rem",borderTop:"1px solid #EDE9E3"}}>
              <button className="btn-ghost" onClick={reset}>+ Crear nuevo listado de producto</button>
            </div>
          </div>
        )}
      </div>

      {lightbox&&(
        <div className="lightbox" onClick={()=>setLightbox(null)}>
          <img src={lightbox} alt="preview"/>
        </div>
      )}

      <footer className="footer">
        <p>ArtesanoAI · Para artesanos ecuatorianos · <a href="https://console.anthropic.com" target="_blank" rel="noreferrer">Powered by Claude</a></p>
      </footer>
    </>
  );
}

/* ── Upload Zone Component ── */
function UploadZone({images,setImages,addFiles,setLightbox,fileRef}){
  const [drag,setDrag]=useState(false);
  return(
    <div>
      <div className={`upload-zone${drag?" drag":""}`}
        onDrop={e=>{e.preventDefault();setDrag(false);addFiles(e.dataTransfer.files);}}
        onDragOver={e=>{e.preventDefault();setDrag(true);}}
        onDragLeave={()=>setDrag(false)}
        onClick={()=>fileRef.current.click()}>
        <span style={{fontSize:40,display:"block",marginBottom:10}}>📷</span>
        <p style={{fontWeight:700,fontSize:15,marginBottom:4,color:"#1C1917"}}>Arrastra tus fotos aquí</p>
        <p style={{fontSize:13,color:"#8B7355",marginBottom:14}}>Hasta 8 fotos · JPG, PNG, HEIC, WEBP</p>
        <span style={{fontSize:13,padding:"7px 20px",borderRadius:20,border:"1px solid #D6D0C8",color:"#8B7355",background:"#fff"}}>Buscar archivos</span>
        <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>addFiles(e.target.files)}/>
      </div>
      {images.length>0&&(
        <div style={{marginTop:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontWeight:600,fontSize:13}}>{images.length} foto{images.length>1?"s":""} cargadas</span>
            <button className="btn-ghost" style={{fontSize:12}} onClick={()=>fileRef.current.click()}>+ Agregar más</button>
          </div>
          <div className="photo-grid">
            {images.map((img,i)=>(
              <div key={i} className="thumb">
                <img src={img.url} alt="" onClick={()=>setLightbox(img.url)}/>
                <span className="thumb-num">#{i+1}</span>
                <button className="thumb-del" onClick={e=>{e.stopPropagation();setImages(p=>p.filter((_,idx)=>idx!==i));}}>✕</button>
              </div>
            ))}
            {images.length<8&&<div className="thumb-add" onClick={()=>fileRef.current.click()}>+</div>}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
