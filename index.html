<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ArtesanoAI</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f3ef; color: #1a1a1a; min-height: 100vh; }
  input, select, textarea, button {
    font-family: inherit; font-size: 13px; color: #1a1a1a;
    border: 0.5px solid #ccc; border-radius: 8px; padding: 8px 12px;
    background: #fff; outline: none; transition: border 0.15s;
  }
  input:focus, select:focus, textarea:focus { border-color: #8B5E3C; }
  button { cursor: pointer; background: #fff; border: 0.5px solid #ccc; }
  button:hover { background: #f5f3ef; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

  /* light theme variables via CSS */
  .bg-primary { background: #ffffff; }
  .bg-secondary { background: #f5f3ef; }
  .text-primary { color: #1a1a1a; }
  .text-secondary { color: #666; }
  .text-tertiary { color: #999; }
  .border { border: 0.5px solid #e0ddd8; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef } = React;

const PLATFORMS = [
  { id:"etsy", name:"Etsy", icon:"🛍️", color:"#F1641E", region:"Global", lang:"en" },
  { id:"mercadolibre", name:"MercadoLibre", icon:"🛒", color:"#D4AC0D", region:"LatAm", lang:"es" },
  { id:"amazon", name:"Amazon Handmade", icon:"📦", color:"#FF9900", region:"Global", lang:"en" },
  { id:"instagram", name:"Instagram Shop", icon:"📸", color:"#E1306C", region:"Global", lang:"en" },
  { id:"facebook", name:"Facebook Shop", icon:"👍", color:"#1877F2", region:"Global", lang:"en" },
  { id:"tiktok", name:"TikTok", icon:"🎵", color:"#555", region:"LatAm", lang:"es" },
  { id:"shopify", name:"Shopify", icon:"🏪", color:"#96BF48", region:"Global", lang:"en" },
  { id:"ecuadorshops", name:"EcuadorShops", icon:"🇪🇨", color:"#003580", region:"Ecuador", lang:"es" },
  { id:"whatsapp", name:"WhatsApp Business", icon:"💬", color:"#25D366", region:"LatAm", lang:"es" },
  { id:"pinterest", name:"Pinterest", icon:"📌", color:"#E60023", region:"Global", lang:"en" },
];

const PLATFORM_FIELDS = {
  etsy:["title","description","tags","materials","shippingNote"],
  mercadolibre:["title","description","attributes","category"],
  amazon:["title","bulletPoints","description","searchTerms"],
  instagram:["caption","storyText","reelsHook"],
  facebook:["title","description","boostSuggestion"],
  tiktok:["hook","script","caption"],
  shopify:["title","metaDescription","productDescription"],
  ecuadorshops:["title","description","shippingNote"],
  whatsapp:["catalogTitle","catalogDescription","promoMessage"],
  pinterest:["title","description","boardSuggestion"],
};

const FIELD_LABELS = {
  title:"Title", description:"Description", tags:"Tags", materials:"Materials",
  shippingNote:"Shipping note", attributes:"Attributes", category:"Category",
  bulletPoints:"Bullet points", searchTerms:"Search terms", caption:"Caption",
  storyText:"Story text", reelsHook:"Reels hook", boostSuggestion:"Boost suggestion",
  hook:"Hook", script:"Script", metaDescription:"Meta description",
  productDescription:"Product description", catalogTitle:"Catalog title",
  catalogDescription:"Catalog description", promoMessage:"Promo message",
  boardSuggestion:"Board suggestion",
};

const SHOOT_STYLES = [
  { id:"hero", label:"Hero shot", desc:"White seamless, perfect studio light", icon:"⬜" },
  { id:"lifestyle", label:"Lifestyle", desc:"Warm home interior, natural context", icon:"🏠" },
  { id:"detail", label:"Detail closeup", desc:"Extreme macro, wood grain & texture", icon:"🔍" },
  { id:"scale", label:"Scale reference", desc:"Elegant neutral prop for size context", icon:"📐" },
  { id:"flatlay", label:"Flat lay", desc:"Overhead styled scene, minimal props", icon:"🪴" },
  { id:"dramatic", label:"Dramatic light", desc:"Dark moody studio, chiaroscuro", icon:"🎭" },
  { id:"outdoor", label:"Outdoor natural", desc:"Golden hour, Ecuadorian nature", icon:"🌿" },
  { id:"gift", label:"Gift packaging", desc:"Premium unboxing / gift wrap scene", icon:"🎁" },
];

const s = {
  wrap: { maxWidth:800, margin:"0 auto", padding:"1.5rem 1rem" },
  card: { background:"#fff", border:"0.5px solid #e0ddd8", borderRadius:12, padding:"1.25rem" },
  cardSecondary: { background:"#f5f3ef", border:"0.5px solid #e0ddd8", borderRadius:12, padding:"1.25rem" },
  label: { fontSize:11, color:"#999", display:"block", marginBottom:4 },
  input: { width:"100%", padding:"8px 12px", borderRadius:8, border:"0.5px solid #ccc", fontSize:13 },
  btnPrimary: { background:"#8B5E3C", color:"#fff", border:"none", borderRadius:10, padding:"11px 20px", fontWeight:500, fontSize:14, cursor:"pointer", width:"100%" },
  btnSecondary: { background:"#f5f3ef", border:"0.5px solid #ccc", borderRadius:8, padding:"6px 14px", fontSize:12, cursor:"pointer" },
  tag: { fontSize:12, padding:"3px 10px", borderRadius:20, background:"#f5f3ef", border:"0.5px solid #e0ddd8", color:"#1a1a1a", display:"inline-block" },
};

function App() {
  const [apiKey, setApiKey] = useState(localStorage.getItem("artesano_key")||"");
  const [apiKeySaved, setApiKeySaved] = useState(!!localStorage.getItem("artesano_key"));
  const [showApiPanel, setShowApiPanel] = useState(false);
  const [step, setStep] = useState("upload");
  const [images, setImages] = useState([]);
  const [details, setDetails] = useState({width:"",height:"",depth:"",material:"",finish:"",price:"",name:"",description:""});
  const [selectedShots, setSelectedShots] = useState(["hero","lifestyle","detail","scale","flatlay"]);
  const [results, setResults] = useState(null);
  const [photoPrompts, setPhotoPrompts] = useState([]);
  const [selectedPlatform, setSelectedPlatform] = useState("etsy");
  const [progress, setProgress] = useState(0);
  const [progressMsg, setProgressMsg] = useState("");
  const [copied, setCopied] = useState(null);
  const [previewField, setPreviewField] = useState("title");
  const [activeTab, setActiveTab] = useState("platforms");
  const [dragOver, setDragOver] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const fileRef = useRef();

  const saveKey = () => {
    if (apiKey.trim().startsWith("sk-")) {
      localStorage.setItem("artesano_key", apiKey.trim());
      setApiKeySaved(true); setShowApiPanel(false);
    }
  };

  const addFiles = (files) => {
    Array.from(files).slice(0, 8 - images.length).forEach(file => {
      const url = URL.createObjectURL(file);
      const reader = new FileReader();
      reader.onload = (e) => {
        const b64 = e.target.result.split(",")[1];
        setImages(prev => [...prev, { url, b64, mime: file.type||"image/jpeg", name: file.name }]);
      };
      reader.readAsDataURL(file);
    });
  };

  const toggleShot = (id) => setSelectedShots(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev,id]);

  const buildPhotoPrompts = () => {
    const n = details.name||"handcrafted wood piece";
    const m = details.material||"wood";
    const f = details.finish||"natural";
    const dim = `${details.width||"?"}x${details.height||"?"}x${details.depth||"?"}cm`;
    const map = {
      hero:`Professional product photography of ${n}, made of ${m} with ${f} finish, dimensions ${dim}. Pure seamless white background, soft diffused studio lighting from 45 degrees, perfect color accuracy, sharp focus throughout, commercial product photography, 8K, photorealistic`,
      lifestyle:`${n} made of ${m} placed in a luxury minimalist Ecuadorian home interior, warm natural afternoon light, linen textures, neutral earth tones, editorial lifestyle photography, Sony A7R V, 50mm f/1.4, photorealistic`,
      detail:`Extreme macro closeup of ${m} grain texture and ${f} finish on ${n}, revealing every fiber and tool mark, dramatic raking side light, shallow depth of field, Nikon Z9 100mm macro, ultra sharp, studio product photography`,
      scale:`${n} (${dim}) displayed on a marble slab next to a single white orchid for scale, clean white background, professional e-commerce photography, overhead perspective, 8K photorealistic`,
      flatlay:`Overhead flat lay of ${n} styled with dried botanicals, natural linen, and a small brass element on a concrete surface, editorial product photography, soft even lighting, photorealistic`,
      dramatic:`${n} lit with dramatic chiaroscuro studio lighting, deep shadow, single spotlight, black seamless background, fine art product photography, museum quality, ultra high detail, photorealistic`,
      outdoor:`${n} placed on a mossy stone outdoors in a lush Ecuadorian cloud forest, dappled golden hour light filtering through leaves, Canon EOS R5, 85mm, bokeh background, photorealistic`,
      gift:`${n} in an open premium kraft gift box with tissue paper and hand-tied raffia ribbon, warm wooden table, soft lifestyle photography, gifting editorial, photorealistic`,
    };
    return selectedShots.map(id => ({ style: SHOOT_STYLES.find(x=>x.id===id), prompt: map[id] })).filter(x=>x.style);
  };

  const generate = async () => {
    if (!apiKeySaved) { setShowApiPanel(true); return; }
    if (images.length === 0) { alert("Please upload at least one photo."); return; }
    setStep("generating"); setProgress(5); setProgressMsg("Analyzing your product photos...");
    const steps = [
      {p:20,m:"Understanding craftsmanship details..."},
      {p:38,m:"Writing Etsy & Amazon listings..."},
      {p:52,m:"Crafting MercadoLibre & EcuadorShops content..."},
      {p:65,m:"Generating social captions & TikTok scripts..."},
      {p:78,m:"Building SEO keywords & hashtags..."},
      {p:88,m:"Creating professional photo shoot prompts..."},
    ];
    let si=0;
    const iv = setInterval(()=>{ if(si<steps.length){setProgress(steps[si].p);setProgressMsg(steps[si].m);si++;} },1200);
    const prompt = `You are an expert e-commerce copywriter for high-end handmade wood crafts targeting Latin America (especially Ecuador) and global markets.
Product: ${details.name||"wood handicraft"}, ${details.width||"?"}W x ${details.height||"?"}H x ${details.depth||"?"}D cm, ${details.material||"wood"}, ${details.finish||"natural"} finish, $${details.price} USD. Notes: ${details.description||"none"}.
Respond ONLY with valid JSON, no markdown:
{"productName":{"en":"...","es":"..."},"tagline":{"en":"...","es":"..."},"shortDescription":{"en":"...","es":"..."},"seoTitle":{"en":"...","es":"..."},"seoKeywords":{"en":["k1","k2","k3","k4","k5","k6","k7","k8","k9","k10"],"es":["k1","k2","k3","k4","k5","k6","k7","k8","k9","k10"]},"hashtags":{"instagram":["#t1","#t2","#t3","#t4","#t5","#t6","#t7","#t8","#t9","#t10"],"tiktok":["#t1","#t2","#t3","#t4","#t5"]},"instagramBio":"...","pricingNote":"...","platforms":{"etsy":{"title":"...","description":"...","tags":["t1","t2","t3","t4","t5","t6","t7","t8","t9","t10","t11","t12","t13"],"materials":["m1","m2"],"shippingNote":"Ships in 3-5 business days carefully packaged."},"mercadolibre":{"title":"...","description":"...","attributes":["Material: ...","Dimensiones: ...","Acabado: ..."],"category":"Artesanías y Manualidades"},"amazon":{"title":"...","bulletPoints":["• Handcrafted...","• Premium material...","• Dimensions...","• Perfect gift...","• Guaranteed quality..."],"description":"...","searchTerms":["s1","s2","s3","s4","s5"]},"instagram":{"caption":"...","storyText":"...","reelsHook":"..."},"facebook":{"title":"...","description":"...","boostSuggestion":"Target: Women 25-45, home decor, handmade, Ecuador."},"tiktok":{"hook":"...","script":"...","caption":"..."},"shopify":{"title":"...","metaDescription":"...","productDescription":"..."},"ecuadorshops":{"title":"...","description":"...","shippingNote":"Envío a todo Ecuador en 2-4 días hábiles."},"whatsapp":{"catalogTitle":"...","catalogDescription":"...","promoMessage":"..."},"pinterest":{"title":"...","description":"...","boardSuggestion":"..."}}}`;

    try {
      const imgContent = images.map(img=>({type:"image",source:{type:"base64",media_type:img.mime,data:img.b64}}));
      imgContent.push({type:"text",text:prompt});
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content:imgContent}]})
      });
      clearInterval(iv);
      const data = await res.json();
      if(data.error) throw new Error(data.error.message);
      const text = data.content?.map(i=>i.text||"").join("")||"";
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      setResults(parsed);
      setPhotoPrompts(buildPhotoPrompts());
      setProgress(100); setProgressMsg("Done!");
      setTimeout(()=>{ setStep("results"); setPreviewField("title"); }, 300);
    } catch(err) {
      clearInterval(iv);
      setStep("details");
      alert("Error: " + err.message);
    }
  };

  const copy = (text, key) => {
    if(!text) return;
    navigator.clipboard.writeText(Array.isArray(text)?text.join("\n"):text);
    setCopied(key); setTimeout(()=>setCopied(null),2000);
  };

  const CopyBtn = ({text,id,small}) => (
    <button onClick={()=>copy(text,id)} style={{fontSize:small?11:12,padding:small?"3px 8px":"5px 12px",borderRadius:6,border:"0.5px solid #ccc",background:copied===id?"#d4edda":s.btnSecondary.background,color:copied===id?"#2d6a4f":"#666",cursor:"pointer",whiteSpace:"nowrap"}}>
      {copied===id?"✓ Copied":"Copy"}
    </button>
  );

  const plat = results?.platforms?.[selectedPlatform];
  const fields = PLATFORM_FIELDS[selectedPlatform]||[];
  const curPlat = PLATFORMS.find(p=>p.id===selectedPlatform);

  const renderVal = (field, val) => {
    if(!val) return <span style={{color:"#999",fontSize:13}}>—</span>;
    if(Array.isArray(val)) {
      if(["tags","searchTerms","materials"].includes(field))
        return <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{val.map((t,i)=><span key={i} style={s.tag}>{t}</span>)}</div>;
      return <ul style={{paddingLeft:16}}>{val.map((v,i)=><li key={i} style={{fontSize:13,marginBottom:4,lineHeight:1.6}}>{v}</li>)}</ul>;
    }
    return <p style={{margin:0,fontSize:13,lineHeight:1.75,whiteSpace:"pre-wrap"}}>{val}</p>;
  };

  const reset = () => { setStep("upload");setImages([]);setResults(null);setPhotoPrompts([]);setDetails({width:"",height:"",depth:"",material:"",finish:"",price:"",name:"",description:""});setSelectedPlatform("etsy");setActiveTab("platforms"); };

  return (
    <div style={s.wrap}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1.5rem"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:28}}>🪵</span>
          <div>
            <h1 style={{fontSize:20,fontWeight:600,margin:0}}>ArtesanoAI</h1>
            <p style={{fontSize:12,color:"#666",margin:0}}>Multi-photo · Professional shoots · 10 platforms</p>
          </div>
        </div>
        <button onClick={()=>setShowApiPanel(p=>!p)} style={{fontSize:12,padding:"7px 14px",borderRadius:8,border:apiKeySaved?"0.5px solid #2d6a4f":"0.5px solid #ccc",background:apiKeySaved?"#d4edda":"#f5f3ef",color:apiKeySaved?"#2d6a4f":"#666",cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
          {apiKeySaved?"✓ API Connected":"⚙ Connect API Key"}
        </button>
      </div>

      {/* API Panel */}
      {showApiPanel&&(
        <div style={{...s.cardSecondary,marginBottom:"1.5rem"}}>
          <p style={{fontWeight:600,fontSize:14,marginBottom:4}}>Anthropic API key</p>
          <p style={{fontSize:12,color:"#666",marginBottom:12}}>Get your key at <a href="https://console.anthropic.com" target="_blank" rel="noreferrer" style={{color:"#8B5E3C"}}>console.anthropic.com</a> · Saved locally in your browser.</p>
          <div style={{display:"flex",gap:8}}>
            <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-ant-..." style={{flex:1}} />
            <button onClick={saveKey} style={{padding:"0 16px",background:"#8B5E3C",color:"#fff",border:"none",borderRadius:8,fontWeight:500,cursor:"pointer"}}>Save</button>
          </div>
          {apiKey&&!apiKey.startsWith("sk-")&&<p style={{fontSize:12,color:"#c0392b",marginTop:6}}>Key must start with sk-</p>}
        </div>
      )}

      {/* Steps indicator */}
      <div style={{display:"flex",alignItems:"center",marginBottom:"2rem"}}>
        {["Upload photos","Product details","Generating","Results"].map((label,i)=>{
          const si=["upload","details","generating","results"].indexOf(step);
          const done=si>i,active=si===i;
          return (
            <div key={label} style={{display:"flex",alignItems:"center",flex:i<3?1:"none"}}>
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                <div style={{width:26,height:26,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:600,background:done?"#8B5E3C":active?"rgba(139,94,60,0.15)":"#e8e5e0",color:done?"#fff":active?"#8B5E3C":"#999",border:active?"1.5px solid #8B5E3C":"none"}}>
                  {done?"✓":i+1}
                </div>
                <span style={{fontSize:10,color:active?"#8B5E3C":"#999",whiteSpace:"nowrap"}}>{label}</span>
              </div>
              {i<3&&<div style={{flex:1,height:1.5,background:done?"#8B5E3C":"#e0ddd8",margin:"0 4px 14px"}}/>}
            </div>
          );
        })}
      </div>

      {/* STEP 1: Upload */}
      {step==="upload"&&(
        <div>
          <div onDrop={e=>{e.preventDefault();setDragOver(false);addFiles(e.dataTransfer.files);}} onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)} onClick={()=>fileRef.current.click()}
            style={{border:`1.5px dashed ${dragOver?"#8B5E3C":"#ccc"}`,borderRadius:16,padding:"3rem 2rem",textAlign:"center",cursor:"pointer",background:dragOver?"rgba(139,94,60,0.05)":"#f5f3ef",marginBottom:"1.5rem",transition:"all 0.2s"}}>
            <div style={{fontSize:40,marginBottom:10}}>📷</div>
            <p style={{fontWeight:600,fontSize:15,marginBottom:4}}>Drop product photos here</p>
            <p style={{fontSize:13,color:"#666",marginBottom:12}}>Up to 8 photos · JPG, PNG, HEIC, WEBP</p>
            <span style={{fontSize:12,padding:"6px 18px",borderRadius:20,border:"0.5px solid #ccc",color:"#666",background:"#fff"}}>Browse files</span>
            <input ref={fileRef} type="file" accept="image/*" multiple style={{display:"none"}} onChange={e=>addFiles(e.target.files)} />
          </div>

          {images.length>0&&(
            <div style={{marginBottom:"1.5rem"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <p style={{fontWeight:500,fontSize:13}}>{images.length} photo{images.length>1?"s":""} ready</p>
                <button onClick={()=>fileRef.current.click()} style={{fontSize:12,color:"#8B5E3C",background:"none",border:"none",cursor:"pointer",padding:0}}>+ Add more</button>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                {images.map((img,i)=>(
                  <div key={i} style={{position:"relative",aspectRatio:"1",borderRadius:10,overflow:"hidden",border:"0.5px solid #e0ddd8"}}>
                    <img src={img.url} alt="" style={{width:"100%",height:"100%",objectFit:"cover",cursor:"pointer",display:"block"}} onClick={()=>setLightbox(img.url)} />
                    <span style={{position:"absolute",top:5,left:7,fontSize:10,color:"#fff",fontWeight:600,textShadow:"0 1px 3px rgba(0,0,0,0.6)"}}>#{i+1}</span>
                    <button onClick={e=>{e.stopPropagation();setImages(prev=>prev.filter((_,idx)=>idx!==i));}} style={{position:"absolute",top:4,right:4,width:20,height:20,borderRadius:"50%",background:"rgba(0,0,0,0.55)",color:"#fff",border:"none",cursor:"pointer",fontSize:11,lineHeight:"20px",textAlign:"center",padding:0}}>✕</button>
                  </div>
                ))}
                {images.length<8&&(
                  <div onClick={()=>fileRef.current.click()} style={{aspectRatio:"1",borderRadius:10,border:"1px dashed #ccc",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#ccc",fontSize:28,background:"#faf9f7"}}>+</div>
                )}
              </div>
            </div>
          )}
          <button onClick={()=>{if(images.length>0)setStep("details");}} disabled={images.length===0} style={{...s.btnPrimary,opacity:images.length===0?0.4:1,cursor:images.length===0?"not-allowed":"pointer"}}>
            Continue with {images.length} photo{images.length!==1?"s":""} →
          </button>
        </div>
      )}

      {/* STEP 2: Details */}
      {step==="details"&&(
        <div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:"1.5rem"}}>
            {images.map((img,i)=>(
              <div key={i} style={{aspectRatio:"1",borderRadius:8,overflow:"hidden",border:"0.5px solid #e0ddd8"}}>
                <img src={img.url} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}} />
              </div>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            {[{k:"name",l:"Product name / type",ph:"e.g. Carved Jaguar Sculpture"},{k:"material",l:"Wood type",ph:"e.g. Teak, Walnut, Cedar"},{k:"finish",l:"Finish / coating",ph:"e.g. Natural oil, lacquer"},{k:"price",l:"Price (USD)",ph:"e.g. 120"}].map(f=>(
              <div key={f.k}><label style={s.label}>{f.l}</label><input value={details[f.k]} onChange={e=>setDetails(d=>({...d,[f.k]:e.target.value}))} placeholder={f.ph} style={s.input} /></div>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:10}}>
            {["width","height","depth"].map(k=>(
              <div key={k}><label style={s.label}>{k.charAt(0).toUpperCase()+k.slice(1)} (cm)</label><input type="number" value={details[k]} onChange={e=>setDetails(d=>({...d,[k]:e.target.value}))} placeholder="0" style={s.input} /></div>
            ))}
          </div>
          <div style={{marginBottom:"1.5rem"}}>
            <label style={s.label}>Extra notes (optional)</label>
            <textarea value={details.description} onChange={e=>setDetails(d=>({...d,description:e.target.value}))} placeholder="Story behind the piece, special features..." rows={2} style={{...s.input,resize:"vertical"}} />
          </div>

          {/* Shoot selector */}
          <div style={{...s.card,marginBottom:"1.5rem"}}>
            <p style={{fontWeight:600,fontSize:14,marginBottom:4}}>📸 Professional photo shoot styles</p>
            <p style={{fontSize:12,color:"#666",marginBottom:12}}>AI generates detailed Midjourney / DALL-E prompts based on your actual product for each style.</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {SHOOT_STYLES.map(sh=>{
                const on=selectedShots.includes(sh.id);
                return (
                  <button key={sh.id} onClick={()=>toggleShot(sh.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,border:on?"1.5px solid #8B5E3C":"0.5px solid #e0ddd8",background:on?"rgba(139,94,60,0.07)":"#faf9f7",cursor:"pointer",textAlign:"left"}}>
                    <span style={{fontSize:20}}>{sh.icon}</span>
                    <div style={{flex:1}}>
                      <p style={{margin:0,fontSize:13,fontWeight:on?600:400}}>{sh.label}</p>
                      <p style={{margin:0,fontSize:11,color:"#888"}}>{sh.desc}</p>
                    </div>
                    {on&&<span style={{color:"#8B5E3C",fontSize:14}}>✓</span>}
                  </button>
                );
              })}
            </div>
            <p style={{fontSize:11,color:"#999",marginTop:10}}>{selectedShots.length} shoot style{selectedShots.length!==1?"s":""} selected</p>
          </div>

          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setStep("upload")} style={{...s.btnSecondary,flex:1}}>← Back</button>
            <button onClick={generate} disabled={!details.name||!details.price} style={{...s.btnPrimary,flex:3,opacity:details.name&&details.price?1:0.4,cursor:details.name&&details.price?"pointer":"not-allowed"}}>
              {apiKeySaved?`✨ Generate listings + ${selectedShots.length} shoot prompts`:"⚙ Connect API key first"}
            </button>
          </div>
        </div>
      )}

      {/* STEP 3: Generating */}
      {step==="generating"&&(
        <div style={{textAlign:"center",padding:"3.5rem 1rem"}}>
          <div style={{fontSize:44,marginBottom:"1.5rem"}}>✨</div>
          <p style={{fontWeight:600,fontSize:16,marginBottom:6}}>Generating your complete package</p>
          <p style={{fontSize:13,color:"#666",marginBottom:"2rem"}}>{progressMsg}</p>
          <div style={{background:"#e8e5e0",borderRadius:8,height:6,overflow:"hidden",maxWidth:420,margin:"0 auto 8px"}}>
            <div style={{height:"100%",width:`${progress}%`,background:"#8B5E3C",borderRadius:8,transition:"width 0.8s ease"}}/>
          </div>
          <p style={{fontSize:12,color:"#999"}}>{progress}% · {images.length} photos · 10 platforms · {selectedShots.length} shoot styles</p>
        </div>
      )}

      {/* STEP 4: Results */}
      {step==="results"&&results&&(
        <div>
          {/* Product card */}
          <div style={{...s.cardSecondary,display:"grid",gridTemplateColumns:"auto 1fr",gap:14,marginBottom:"1.5rem"}}>
            <div style={{display:"flex",gap:6}}>
              {images.slice(0,3).map((img,i)=>(
                <img key={i} src={img.url} alt="" onClick={()=>setLightbox(img.url)} style={{width:52,height:52,objectFit:"cover",borderRadius:6,cursor:"pointer",border:"0.5px solid #e0ddd8",display:"block"}} />
              ))}
              {images.length>3&&<div style={{width:52,height:52,borderRadius:6,background:"#fff",border:"0.5px solid #e0ddd8",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:"#666"}}>+{images.length-3}</div>}
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <p style={{fontWeight:600,fontSize:15,marginBottom:2}}>{results.productName?.en}</p>
                <p style={{fontSize:13,color:"#666",marginBottom:4}}>{results.productName?.es}</p>
                <p style={{fontSize:12,color:"#888",fontStyle:"italic"}}>{results.tagline?.en}</p>
              </div>
              <span style={{fontSize:12,padding:"4px 10px",borderRadius:20,background:"#d4edda",color:"#2d6a4f",whiteSpace:"nowrap"}}>✓ Ready</span>
            </div>
          </div>

          {/* Main tabs */}
          <div style={{display:"flex",gap:2,marginBottom:"1.5rem",borderBottom:"0.5px solid #e0ddd8"}}>
            {[{id:"platforms",label:"Platform listings"},{id:"shoots",label:`Photo shoots (${photoPrompts.length})`},{id:"seo",label:"SEO & Keywords"},{id:"hashtags",label:"Hashtags"}].map(t=>(
              <button key={t.id} onClick={()=>setActiveTab(t.id)} style={{fontSize:13,padding:"8px 14px",borderRadius:"6px 6px 0 0",border:"none",borderBottom:activeTab===t.id?"2px solid #8B5E3C":"2px solid transparent",background:"transparent",color:activeTab===t.id?"#8B5E3C":"#666",fontWeight:activeTab===t.id?600:400,cursor:"pointer"}}>
                {t.label}
              </button>
            ))}
          </div>

          {/* PLATFORMS */}
          {activeTab==="platforms"&&(
            <div style={{display:"grid",gridTemplateColumns:"190px 1fr",gap:"1.25rem"}}>
              <div>
                <p style={{fontSize:11,color:"#999",textTransform:"uppercase",letterSpacing:0.5,marginBottom:8}}>Platforms</p>
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  {PLATFORMS.map(p=>(
                    <button key={p.id} onClick={()=>{setSelectedPlatform(p.id);setPreviewField(PLATFORM_FIELDS[p.id]?.[0]);}} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:8,border:selectedPlatform===p.id?`1.5px solid ${p.color}`:"0.5px solid #e0ddd8",background:selectedPlatform===p.id?p.color+"18":"#fff",cursor:"pointer",textAlign:"left",width:"100%"}}>
                      <span style={{fontSize:15}}>{p.icon}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <p style={{margin:0,fontSize:12,fontWeight:selectedPlatform===p.id?600:400,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</p>
                        <p style={{margin:0,fontSize:10,color:"#999"}}>{p.region} · {p.lang==="es"?"ES":"EN"}</p>
                      </div>
                    </button>
                  ))}
                </div>
              </div>

              <div style={{minWidth:0}}>
                {plat&&(
                  <div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"0.75rem"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{fontSize:18}}>{curPlat?.icon}</span>
                        <div>
                          <p style={{margin:0,fontWeight:600,fontSize:14}}>{curPlat?.name}</p>
                          <p style={{margin:0,fontSize:11,color:"#999"}}>{curPlat?.lang==="es"?"Spanish listing":"English listing"}</p>
                        </div>
                      </div>
                      <button onClick={()=>{const all=fields.map(f=>`=== ${(FIELD_LABELS[f]||f).toUpperCase()} ===\n${Array.isArray(plat[f])?plat[f].join("\n"):plat[f]||""}`).join("\n\n");copy(all,"all");}} style={{fontSize:12,padding:"5px 12px",borderRadius:8,border:"0.5px solid #8B5E3C",background:"rgba(139,94,60,0.08)",color:"#8B5E3C",cursor:"pointer",fontWeight:500}}>
                        {copied==="all"?"✓ Copied all":"Copy all"}
                      </button>
                    </div>

                    <div style={{marginBottom:"0.75rem"}}>
                      <label style={s.label}>Select field to view</label>
                      <select value={previewField||""} onChange={e=>setPreviewField(e.target.value)} style={{...s.input}}>
                        {fields.map(f=><option key={f} value={f}>{FIELD_LABELS[f]}</option>)}
                      </select>
                    </div>

                    {previewField&&plat[previewField]!==undefined&&(
                      <div style={{...s.card,marginBottom:"1rem"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"0.75rem"}}>
                          <span style={{fontWeight:600,fontSize:13}}>{FIELD_LABELS[previewField]}</span>
                          <CopyBtn text={Array.isArray(plat[previewField])?plat[previewField].join(previewField==="bulletPoints"?"\n":", "):plat[previewField]} id={`${selectedPlatform}-${previewField}`} />
                        </div>
                        {renderVal(previewField,plat[previewField])}
                      </div>
                    )}

                    <div style={{borderTop:"0.5px solid #e0ddd8",paddingTop:"1rem"}}>
                      <p style={{fontSize:11,color:"#999",textTransform:"uppercase",letterSpacing:0.5,marginBottom:8}}>All fields</p>
                      <div style={{display:"flex",flexDirection:"column",gap:6}}>
                        {fields.map(f=>{
                          const val=plat[f];
                          if(!val) return null;
                          const prev=Array.isArray(val)?val.slice(0,2).join(", ")+(val.length>2?"...":""):String(val).slice(0,70)+(String(val).length>70?"...":"");
                          return (
                            <button key={f} onClick={()=>setPreviewField(f)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 12px",borderRadius:8,border:previewField===f?"1.5px solid #8B5E3C":"0.5px solid #e0ddd8",background:previewField===f?"rgba(139,94,60,0.05)":"#f5f3ef",cursor:"pointer",textAlign:"left",gap:10}}>
                              <div style={{flex:1,minWidth:0}}>
                                <p style={{margin:0,fontSize:10,color:"#999",textTransform:"uppercase",letterSpacing:0.4,marginBottom:2}}>{FIELD_LABELS[f]}</p>
                                <p style={{margin:0,fontSize:12,color:"#666",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{prev}</p>
                              </div>
                              <CopyBtn text={Array.isArray(val)?val.join(", "):val} id={`mini-${f}`} small />
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* SHOOTS */}
          {activeTab==="shoots"&&(
            <div>
              <div style={{...s.cardSecondary,marginBottom:"1.25rem"}}>
                <p style={{fontWeight:600,fontSize:13,marginBottom:4}}>How to use these prompts</p>
                <p style={{fontSize:12,color:"#666",lineHeight:1.6,margin:0}}>Copy any prompt and paste it into <strong>Midjourney</strong> (prefix /imagine), <strong>DALL-E 3</strong> in ChatGPT, or <strong>Adobe Firefly</strong>. Each is tailored to your product's exact dimensions, material, and finish.</p>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:12}}>
                {photoPrompts.map((item,i)=>(
                  <div key={i} style={s.card}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,marginBottom:10}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <span style={{fontSize:22}}>{item.style.icon}</span>
                        <div>
                          <p style={{margin:0,fontWeight:600,fontSize:14}}>{item.style.label}</p>
                          <p style={{margin:0,fontSize:11,color:"#888"}}>{item.style.desc}</p>
                        </div>
                      </div>
                      <CopyBtn text={item.prompt} id={`shoot-${i}`} />
                    </div>
                    <div style={{background:"#f5f3ef",borderRadius:8,padding:"10px 12px",marginBottom:8}}>
                      <p style={{margin:0,fontSize:12,color:"#555",lineHeight:1.7,fontFamily:"monospace"}}>{item.prompt}</p>
                    </div>
                    <div style={{display:"flex",gap:6"}}>
                      {["Midjourney","DALL-E 3","Adobe Firefly"].map(tool=>(
                        <span key={tool} style={{fontSize:11,padding:"3px 8px",borderRadius:20,background:"#f5f3ef",border:"0.5px solid #e0ddd8",color:"#888"}}>{tool}</span>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
              <div style={{textAlign:"right",marginTop:"1rem"}}>
                <button onClick={()=>{const all=photoPrompts.map(p=>`=== ${p.style.label.toUpperCase()} ===\n${p.prompt}`).join("\n\n");copy(all,"all-shoots");}} style={{fontSize:13,padding:"8px 16px",borderRadius:8,border:"0.5px solid #8B5E3C",background:"rgba(139,94,60,0.08)",color:"#8B5E3C",cursor:"pointer",fontWeight:500}}>
                  {copied==="all-shoots"?"✓ Copied all prompts":"Copy all shoot prompts"}
                </button>
              </div>
            </div>
          )}

          {/* SEO */}
          {activeTab==="seo"&&(
            <div style={{display:"grid",gap:"1rem"}}>
              {["en","es"].map(l=>(
                <div key={l} style={s.card}>
                  <p style={{fontWeight:600,fontSize:13,marginBottom:12}}>{l==="en"?"🇺🇸 English":"🇪🇨 Spanish"}</p>
                  <div style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span style={{fontSize:11,color:"#999",textTransform:"uppercase"}}>SEO title</span>
                      <CopyBtn text={results.seoTitle?.[l]} id={`seo-t-${l}`} small />
                    </div>
                    <p style={{margin:0,fontSize:13,background:"#f5f3ef",padding:"8px 10px",borderRadius:6}}>{results.seoTitle?.[l]}</p>
                  </div>
                  <div>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                      <span style={{fontSize:11,color:"#999",textTransform:"uppercase"}}>Keywords</span>
                      <CopyBtn text={results.seoKeywords?.[l]?.join(", ")} id={`seo-k-${l}`} small />
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {results.seoKeywords?.[l]?.map((k,i)=><span key={i} style={{fontSize:12,padding:"3px 10px",borderRadius:20,background:"rgba(139,94,60,0.08)",border:"0.5px solid rgba(139,94,60,0.25)",color:"#1a1a1a"}}>{k}</span>)}
                    </div>
                  </div>
                </div>
              ))}
              {results.pricingNote&&(
                <div style={s.card}>
                  <p style={{fontSize:11,color:"#999",textTransform:"uppercase",marginBottom:4}}>Premium pricing rationale</p>
                  <p style={{margin:0,fontSize:13,color:"#555",lineHeight:1.6}}>{results.pricingNote}</p>
                </div>
              )}
            </div>
          )}

          {/* HASHTAGS */}
          {activeTab==="hashtags"&&(
            <div style={{display:"grid",gap:"1rem"}}>
              {[{k:"instagram",label:"📸 Instagram",color:"#E1306C"},{k:"tiktok",label:"🎵 TikTok",color:"#555"}].map(sh=>(
                <div key={sh.k} style={s.card}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
                    <p style={{margin:0,fontWeight:600,fontSize:13}}>{sh.label}</p>
                    <CopyBtn text={results.hashtags?.[sh.k]?.join(" ")} id={`hash-${sh.k}`} small />
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                    {results.hashtags?.[sh.k]?.map((h,i)=><span key={i} style={{fontSize:12,padding:"3px 10px",borderRadius:20,background:sh.color+"12",border:`0.5px solid ${sh.color}44`}}>{h}</span>)}
                  </div>
                </div>
              ))}
              {results.instagramBio&&(
                <div style={s.card}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                    <p style={{margin:0,fontWeight:600,fontSize:13}}>Instagram bio line</p>
                    <CopyBtn text={results.instagramBio} id="bio" small />
                  </div>
                  <p style={{margin:0,fontSize:13,color:"#555",background:"#f5f3ef",padding:"8px 10px",borderRadius:6}}>{results.instagramBio}</p>
                </div>
              )}
            </div>
          )}

          <div style={{textAlign:"center",marginTop:"2rem",paddingTop:"1.5rem",borderTop:"0.5px solid #e0ddd8"}}>
            <button onClick={reset} style={{fontSize:13,color:"#666",padding:"8px 20px"}}>+ New product listing</button>
          </div>
        </div>
      )}

      {/* Lightbox */}
      {lightbox&&(
        <div onClick={()=>setLightbox(null)} style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,cursor:"pointer"}}>
          <img src={lightbox} alt="preview" style={{maxWidth:"90vw",maxHeight:"90vh",objectFit:"contain",borderRadius:8,display:"block"}} />
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
