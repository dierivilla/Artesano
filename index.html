<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="ArtesanoAI — Convierte tus artesanías en madera en listados profesionales para MercadoLibre Ecuador, Etsy, Amazon y más."/>
<title>ArtesanoAI 🪵</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#FAF8F5;color:#1C1917;min-height:100vh;line-height:1.6}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#D6D0C8;border-radius:3px}

input,select,textarea,button{font-family:inherit;font-size:13px;color:#1C1917;border:1px solid #E2DDD8;border-radius:8px;padding:9px 12px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:#8B5E3C;box-shadow:0 0 0 3px rgba(139,94,60,.12)}
button{cursor:pointer;background:#fff;border:1px solid #E2DDD8;transition:all .15s}
button:hover{background:#F5F0EB;border-color:#C9B9A8}
button:active{transform:scale(.98)}

.page{max-width:900px;margin:0 auto;padding:1.5rem 1.25rem 5rem}
.navbar{position:sticky;top:0;z-index:100;background:rgba(250,248,245,.94);backdrop-filter:blur(14px);border-bottom:1px solid #EDE9E3;padding:0 1.25rem}
.navbar-inner{max-width:900px;margin:0 auto;height:58px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand-name{font-size:18px;font-weight:700;color:#1C1917;letter-spacing:-.3px}
.brand-sub{font-size:11px;color:#8B7355;margin-top:-2px}

.btn-primary{background:linear-gradient(135deg,#8B5E3C,#6B4423);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-weight:600;font-size:14px;cursor:pointer;width:100%;transition:opacity .15s,transform .1s;box-shadow:0 2px 10px rgba(139,94,60,.3)}
.btn-primary:hover{opacity:.91}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline{background:transparent;border:1px solid #8B5E3C;color:#8B5E3C;border-radius:8px;padding:7px 16px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn-outline:hover{background:rgba(139,94,60,.06)}
.btn-ghost{background:none;border:none;color:#8B7355;font-size:13px;cursor:pointer;padding:6px 12px;border-radius:6px}
.btn-ghost:hover{background:#F0EBE3;color:#5C3D1E}
.btn-copy{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid #E2DDD8;background:#FAF8F5;color:#6B6460;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn-copy:hover{background:#F0EBE3;border-color:#C9B9A8}
.btn-copy.ok{background:#D4EDDA;border-color:#A8D5B5;color:#2D6A4F}
.btn-copy-big{font-size:13px;padding:9px 20px;border-radius:8px;border:1.5px solid #8B5E3C;background:rgba(139,94,60,.07);color:#5C3D1E;cursor:pointer;font-weight:600;white-space:nowrap;transition:all .15s}
.btn-copy-big:hover{background:rgba(139,94,60,.13)}
.btn-copy-big.ok{background:#D4EDDA;border-color:#A8D5B5;color:#2D6A4F}

.card{background:#fff;border:1px solid #EDE9E3;border-radius:14px;padding:1.25rem}
.card-muted{background:#F5F0EB;border:1px solid #EDE9E3;border-radius:14px;padding:1.25rem}
.card-highlight{background:#fff;border:2px solid #8B5E3C;border-radius:14px;padding:1.25rem}
.card-ml{background:#fff;border:2px solid #FFD100;border-radius:14px;padding:1.5rem}

.hero{text-align:center;padding:3rem 1rem 2.5rem}
.hero-icon{font-size:60px;display:block;margin-bottom:1rem}
.hero-title{font-size:30px;font-weight:800;letter-spacing:-1px;color:#1C1917;margin-bottom:8px}
.hero-sub{font-size:14px;color:#8B7355;max-width:500px;margin:0 auto 1.5rem;line-height:1.65}
.hero-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:2rem}
.hero-pill{font-size:12px;padding:5px 14px;border-radius:20px;background:#fff;border:1px solid #EDE9E3;color:#5C3D1E;font-weight:500}
.hero-pill.ml{background:#FFF9D6;border-color:#FFD100;color:#8B6914}

.steps{display:flex;align-items:center;margin-bottom:2rem}
.step-node{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:70px}
.step-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transition:all .3s}
.step-dot.done{background:#8B5E3C;color:#fff}
.step-dot.active{background:rgba(139,94,60,.12);color:#8B5E3C;border:2px solid #8B5E3C}
.step-dot.idle{background:#EDE9E3;color:#A89880}
.step-lbl{font-size:10px;white-space:nowrap;color:#A89880;transition:color .3s}
.step-lbl.active{color:#8B5E3C;font-weight:600}
.step-line{flex:1;height:2px;margin:0 4px 14px;border-radius:1px;transition:background .3s}

.upload-zone{border:2px dashed #D6D0C8;border-radius:16px;padding:3rem 2rem;text-align:center;cursor:pointer;background:#FDFCFB;transition:all .2s;margin-bottom:1.5rem}
.upload-zone:hover,.upload-zone.drag{border-color:#8B5E3C;background:rgba(139,94,60,.04)}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.25rem}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid #EDE9E3}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-num{position:absolute;top:5px;left:7px;font-size:10px;color:#fff;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.photo-del{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;cursor:pointer;font-size:11px;line-height:20px;text-align:center;padding:0}
.photo-del:hover{background:rgba(200,30,30,.85)}
.photo-add{aspect-ratio:1;border-radius:10px;border:1.5px dashed #D6D0C8;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#C9B9A8;font-size:28px;background:#FDFCFB;transition:all .15s}
.photo-add:hover{border-color:#8B5E3C;color:#8B5E3C}

.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.fgroup label{font-size:11px;color:#8B7355;display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.fgroup input,.fgroup textarea,.fgroup select{width:100%}

.shoot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shoot-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid #EDE9E3;background:#FDFCFB;cursor:pointer;text-align:left;transition:all .15s;width:100%}
.shoot-btn:hover{border-color:#C9B9A8;background:#F5F0EB}
.shoot-btn.on{border:1.5px solid #8B5E3C;background:rgba(139,94,60,.06)}

.progress-wrap{background:#EDE9E3;border-radius:8px;height:7px;overflow:hidden;max-width:460px;margin:0 auto}
.progress-bar{height:100%;background:linear-gradient(90deg,#8B5E3C,#C4845A);border-radius:8px;transition:width .8s ease}

.tabs{display:flex;gap:2px;border-bottom:1px solid #EDE9E3;margin-bottom:1.5rem;overflow-x:auto}
.tab{font-size:13px;padding:9px 16px;border-radius:6px 6px 0 0;border:none;border-bottom:2px solid transparent;background:transparent;color:#8B7355;font-weight:400;cursor:pointer;transition:all .15s;white-space:nowrap}
.tab.active{color:#8B5E3C;font-weight:700;border-bottom-color:#8B5E3C}
.tab:hover:not(.active){color:#5C3D1E;background:#F5F0EB}

.plat-layout{display:grid;grid-template-columns:195px 1fr;gap:1.5rem}
.plat-list{display:flex;flex-direction:column;gap:4px}
.plat-btn{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;border:1px solid #EDE9E3;background:#fff;cursor:pointer;text-align:left;width:100%;transition:all .15s}
.plat-btn:hover{background:#F5F0EB;border-color:#C9B9A8}
.plat-btn.active{border-width:1.5px}

.field-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;border:1px solid #EDE9E3;background:#FAF8F5;cursor:pointer;text-align:left;gap:10px;transition:all .15s}
.field-row:hover{background:#F0EBE3;border-color:#C9B9A8}
.field-row.active{border:1.5px solid #8B5E3C;background:rgba(139,94,60,.04)}

.tag{font-size:12px;padding:4px 10px;border-radius:20px;background:#F5F0EB;border:1px solid #EDE9E3;color:#5C3D1E;display:inline-block}
.tag-wood{background:rgba(139,94,60,.08);border-color:rgba(139,94,60,.25);color:#5C3D1E}
.tag-ml{background:#FFF9D6;border-color:#FFD100;color:#7A5C00}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500}
.badge-ready{background:#D4EDDA;color:#2D6A4F}
.badge-improved{background:linear-gradient(135deg,rgba(139,94,60,.1),rgba(196,132,90,.1));border:1px solid rgba(139,94,60,.2);color:#8B5E3C}
.slbl{font-size:11px;color:#A89880;text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.divider{height:1px;background:#EDE9E3;margin:1.25rem 0}

/* MercadoLibre special section */
.ml-header{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.ml-logo{font-size:32px}
.ml-badge{background:#FFD100;color:#1C1917;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.ml-field{border:1px solid #EDE9E3;border-radius:10px;padding:1rem 1.25rem;margin-bottom:10px;background:#FDFCFB}
.ml-field-label{font-size:11px;color:#8B7355;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.ml-field-value{font-size:13px;color:#1C1917;line-height:1.7;white-space:pre-wrap}
.ml-tip{background:#FFF9D6;border:1px solid #FFD100;border-radius:8px;padding:10px 14px;font-size:12px;color:#7A5C00;line-height:1.6}
.ml-tip strong{color:#5C4000}
.ml-copy-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}

.prompt-mono{background:#F5F0EB;border-radius:8px;padding:12px 14px;font-family:'SF Mono',Menlo,'Courier New',monospace;font-size:12px;color:#5C3D1E;line-height:1.7}
.improve-opt{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid #EDE9E3;background:#fff;color:#5C3D1E;cursor:pointer;transition:all .15s}
.improve-opt:hover,.improve-opt.sel{background:rgba(139,94,60,.08);border-color:#8B5E3C}
.ai-glow{border-left:3px solid #8B5E3C;padding-left:10px;background:rgba(139,94,60,.03);border-radius:0 8px 8px 0}

.lightbox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:pointer}
.lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:10px;display:block}
.footer{text-align:center;padding:2rem 0 1rem;font-size:12px;color:#C9B9A8;border-top:1px solid #EDE9E3;margin-top:3rem}
.footer a{color:#8B7355;text-decoration:none}

@media(max-width:640px){
  .plat-layout{grid-template-columns:1fr}
  .form-grid-2{grid-template-columns:1fr}
  .shoot-grid{grid-template-columns:1fr}
  .photo-grid{grid-template-columns:repeat(3,1fr)}
  .hero-title{font-size:24px}
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <div class="brand">
      <span style="font-size:24px">🪵</span>
      <div>
        <div class="brand-name">ArtesanoAI</div>
        <div class="brand-sub">Artesanías · Ecuador &amp; LatAm</div>
      </div>
    </div>
    <div id="nav-btn"></div>
  </div>
</nav>

<div class="page" id="root"></div>

<script type="text/babel">
const { useState, useRef, useCallback } = React;

const PLATFORMS = [
  {id:"mercadolibre", name:"MercadoLibre Ecuador", icon:"🛒", color:"#FFD100", region:"Ecuador/LatAm", lang:"es", priority:true},
  {id:"etsy",         name:"Etsy",                 icon:"🛍️", color:"#F1641E", region:"Global",       lang:"en"},
  {id:"amazon",       name:"Amazon Handmade",      icon:"📦", color:"#FF9900", region:"Global",       lang:"en"},
  {id:"instagram",    name:"Instagram Shop",       icon:"📸", color:"#E1306C", region:"Global",       lang:"en"},
  {id:"facebook",     name:"Facebook Shop",        icon:"👍", color:"#1877F2", region:"Global",       lang:"en"},
  {id:"tiktok",       name:"TikTok",               icon:"🎵", color:"#333",    region:"LatAm",        lang:"es"},
  {id:"shopify",      name:"Shopify",              icon:"🏪", color:"#96BF48", region:"Global",       lang:"en"},
  {id:"ecuadorshops", name:"EcuadorShops",         icon:"🇪🇨", color:"#003580", region:"Ecuador",      lang:"es"},
  {id:"whatsapp",     name:"WhatsApp Business",    icon:"💬", color:"#25D366", region:"LatAm",        lang:"es"},
  {id:"pinterest",    name:"Pinterest",            icon:"📌", color:"#E60023", region:"Global",       lang:"en"},
];

const PF = {
  mercadolibre:["titulo","descripcion","atributos","categoria","condicion","palabrasClave","notaEnvio","mensajeVendedor"],
  etsy:        ["title","description","tags","materials","shippingNote"],
  amazon:      ["title","bulletPoints","description","searchTerms"],
  instagram:   ["caption","storyText","reelsHook"],
  facebook:    ["title","description","boostSuggestion"],
  tiktok:      ["hook","script","caption"],
  shopify:     ["title","metaDescription","productDescription"],
  ecuadorshops:["title","description","shippingNote"],
  whatsapp:    ["catalogTitle","catalogDescription","promoMessage"],
  pinterest:   ["title","description","boardSuggestion"],
};

const FL = {
  titulo:"Título",descripcion:"Descripción",atributos:"Atributos",categoria:"Categoría",
  condicion:"Condición",palabrasClave:"Palabras clave",notaEnvio:"Nota de envío",mensajeVendedor:"Mensaje al comprador",
  title:"Title",description:"Description",tags:"Tags",materials:"Materials",
  shippingNote:"Shipping note",bulletPoints:"Bullet points",searchTerms:"Search terms",
  caption:"Caption",storyText:"Story text",reelsHook:"Reels hook",
  boostSuggestion:"Boost suggestion",hook:"Hook",script:"Script",
  metaDescription:"Meta description",productDescription:"Product description",
  catalogTitle:"Catalog title",catalogDescription:"Catalog description",promoMessage:"Promo message",boardSuggestion:"Board suggestion",
};

const SHOOT_STYLES = [
  {id:"hero",      label:"Foto principal",    desc:"Fondo blanco, luz de estudio perfecta",    icon:"⬜"},
  {id:"lifestyle", label:"Estilo de vida",    desc:"Hogar cálido, contexto ecuatoriano",        icon:"🏠"},
  {id:"detail",    label:"Detalle extremo",   desc:"Macro: grano de madera y textura",          icon:"🔍"},
  {id:"scale",     label:"Referencia escala", desc:"Prop elegante para mostrar dimensiones",    icon:"📐"},
  {id:"flatlay",   label:"Flat lay",          desc:"Vista aérea con props minimalistas",        icon:"🪴"},
  {id:"dramatic",  label:"Luz dramática",     desc:"Studio oscuro, claroscuro cinematográfico", icon:"🎭"},
  {id:"outdoor",   label:"Exterior natural",  desc:"Hora dorada, bosque nublado ecuatoriano",   icon:"🌿"},
  {id:"gift",      label:"Empaque regalo",    desc:"Unboxing premium, envoltura artesanal",     icon:"🎁"},
];

const IMPROVE_TONES = [
  "Más lujoso","Más emocional","Corto y directo","Historia de origen Ecuador",
  "Resaltar la madera","Ángulo ecológico","Más optimizado para SEO","Formal / profesional",
  "More luxurious","Highlight craftsmanship","Add premium gifting angle","More SEO keywords",
];

async function callClaude(apiKey, messages, maxTokens=4000) {
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens,messages})
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return data.content?.map(i=>i.text||"").join("")||"";
}

export default function App() {
  const [apiKey,   setApiKey]   = useState(localStorage.getItem("artesano_key")||"");
  const [apiSaved, setApiSaved] = useState(!!localStorage.getItem("artesano_key"));
  const [showApi,  setShowApi]  = useState(false);
  const [step,     setStep]     = useState("home");
  const [images,   setImages]   = useState([]);
  const [details,  setDetails]  = useState({width:"",height:"",depth:"",material:"",finish:"",price:"",name:"",description:""});
  const [selShots, setSelShots] = useState(["hero","lifestyle","detail","scale","flatlay"]);
  const [results,  setResults]  = useState(null);
  const [shoots,   setShoots]   = useState([]);
  const [selPlat,  setSelPlat]  = useState("mercadolibre");
  const [progress, setProgress] = useState(0);
  const [progMsg,  setProgMsg]  = useState("");
  const [copied,   setCopied]   = useState(null);
  const [prevField,setPrevField]= useState(null);
  const [activeTab,setActiveTab]= useState("ml");
  const [dragOver, setDragOver] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const [improveOpts,setImproveOpts]=useState([]);
  const [improved, setImproved] = useState({});
  const [improving_,setImproving_]=useState(false);
  const fileRef = useRef();

  const saveKey = () => {
    const k=apiKey.trim();
    if(k.startsWith("sk-")){localStorage.setItem("artesano_key",k);setApiSaved(true);setShowApi(false);}
  };

  const addFiles = (files) => {
    Array.from(files).slice(0,8-images.length).forEach(file=>{
      const url=URL.createObjectURL(file);
      const reader=new FileReader();
      reader.onload=e=>{
        const b64=e.target.result.split(",")[1];
        setImages(prev=>[...prev,{url,b64,mime:file.type||"image/jpeg"}]);
      };
      reader.readAsDataURL(file);
    });
  };

  const buildShoots = useCallback(()=>{
    const n=details.name||"artesanía en madera";
    const m=details.material||"madera";
    const f=details.finish||"natural";
    const dim=`${details.width||"?"}An × ${details.height||"?"}Al × ${details.depth||"?"}P cm`;
    const map={
      hero:`Fotografía comercial profesional de ${n}, elaborada en ${m} con acabado ${f}, dimensiones ${dim}. Fondo blanco infinito, iluminación suave de estudio a 45°, balance de blancos perfecto, foco nítido en toda la pieza, calidad Hasselblad 8K, fotorrealista`,
      lifestyle:`${n} en ${m} con acabado ${f} colocada en un hogar ecuatoriano de lujo — estantes de madera envejecida, textiles artesanales tejidos, luz cálida de tarde entrando por ventana, fotografía editorial lifestyle, Sony A7R V 50mm f/1.4, fotorrealista`,
      detail:`Macro extremo del grano de ${m} y el acabado ${f} en ${n}, revelando marcas de herramienta y fibras naturales, luz rasante dramática, Nikon Z9 100mm f/2.8 macro, ampliación 1:1, ultra nítido, fotografía de producto de estudio`,
      scale:`${n} (${dim}) sobre una losa de mármol pulido, una calla blanca a su lado como referencia de escala, fondo blanco, fotografía comercial e-commerce cenital, 8K fotorrealista`,
      flatlay:`Vista cenital de ${n} estilizada con paja toquilla, lino natural, una tarjeta artesanal de kraft y pétalos de rosa seca sobre cemento pulido, fotografía editorial producto, iluminación difusa uniforme, estética de marca artesanal de lujo`,
      dramatic:`${n} iluminada con un único foco duro contra fondo negro mate absoluto, sombras profundas chiaroscuro que revelan cada detalle de la superficie, fotografía de arte museística, Leica S3, mood cinematográfico, ultra alta definición`,
      outdoor:`${n} apoyada en una roca volcánica musgosa en un bosque nublado ecuatoriano, luz dorada del atardecer filtrada por el dosel del bosque, niebla suave de fondo, Canon EOS R5 85mm f/1.2 L, bokeh verde exuberante, fotorrealista`,
      gift:`${n} dentro de una caja de regalo kraft premium abierta, papel de seda marfil, lazo de rafia natural anudado a mano, mesa de nogal cálido, flores secas decorativas, fotografía editorial de regalo de lujo, fotorrealista`,
    };
    return selShots.map(id=>({style:SHOOT_STYLES.find(x=>x.id===id),prompt:map[id]})).filter(x=>x.style);
  },[details,selShots]);

  const generate = async () => {
    if(!apiSaved){setShowApi(true);return;}
    if(!images.length){alert("Por favor sube al menos una foto.");return;}
    setStep("generating");setProgress(5);setProgMsg("Analizando tus fotos del producto…");

    const steps=[
      {p:18,m:"Entendiendo los detalles artesanales…"},
      {p:32,m:"Escribiendo listado para MercadoLibre Ecuador…"},
      {p:47,m:"Creando contenido para Etsy y Amazon…"},
      {p:62,m:"Generando captions para Instagram y TikTok…"},
      {p:75,m:"Construyendo palabras clave SEO bilingüe…"},
      {p:87,m:"Finalizando WhatsApp, Pinterest y Shopify…"},
    ];
    let si=0;
    const iv=setInterval(()=>{if(si<steps.length){setProgress(steps[si].p);setProgMsg(steps[si].m);si++;}},1300);

                    <div className="ml-field-label">

                      <CopyBtn text={Array.isArray(val)?val.join("\n"):val} id={`ml-${f}`}/>
                    </div>
                    {tip&&<p style={{fontSize:11,color:"#8B7355",marginBottom:8}}>💡 {tip}</p>}
                    <div className={`ml-field-value${hasImproved?" ai-glow":""}`}>
                      {renderVal(f,val)}
                    </div>
                    {/* Character count for title */}
                    {f==="titulo"&&val&&(
                      <p style={{fontSize:11,marginTop:6,color:String(val).length>60?"#C0392B":"#2D6A4F"}}>
                        {String(val).length}/60 caracteres {String(val).length>60?"⚠️ Muy largo":"✓ OK"}
                      </p>
                    )}
                  </div>
                );
              })}

              {/* AI Improve for ML */}
              <div className="card" style={{marginTop:"1.5rem"}}>
                <h3 style={{marginBottom:6}}>✨ Mejorar con IA</h3>
                <p style={{fontSize:12,color:"#8B7355",marginBottom:10}}>Selecciona el campo a mejorar y el tono deseado.</p>
                <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
                  <select value={prevField||"titulo"} onChange={e=>setPrevField(e.target.value)} style={{flex:1,minWidth:160}}>
                    {(PF.mercadolibre||[]).map(f=><option key={f} value={f}>{FL[f]||f}</option>)}
                  </select>
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:10}}>
                  {IMPROVE_TONES.map(t=>(
                    <button key={t} className={`improve-opt${improveOpts.includes(t)?" sel":""}`} onClick={()=>setImproveOpts(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t])}>{t}</button>
                  ))}
                </div>
                <button className="btn-primary" disabled={improving_} onClick={()=>improveField("mercadolibre",prevField||"titulo")}>
                  {improving_?"Mejorando…":"✨ Mejorar campo seleccionado"}
                </button>
                {Object.keys(improved).filter(k=>k.startsWith("mercadolibre_")).length>0&&(
                  <button className="btn-ghost" style={{marginTop:8,width:"100%"}} onClick={()=>setImproved(p=>{const n={...p};Object.keys(n).forEach(k=>{if(k.startsWith("mercadolibre_"))delete n[k];});return n;})}>
                    Revertir todas las mejoras
                  </button>
                )}
              </div>
            </div>
          )}

          {/* ── OTHER PLATFORMS TAB ── */}
          {activeTab==="platforms"&&(
            <div className="plat-layout">
              <div>
                <p className="slbl" style={{marginBottom:8}}>Plataformas</p>
                <div className="plat-list">
                  {PLATFORMS.filter(p=>p.id!=="mercadolibre").map(p=>(
                    <button key={p.id} className={`plat-btn${selPlat===p.id?" active":""}`}
                      style={selPlat===p.id?{borderColor:p.color,background:p.color+"14"}:{}}
                      onClick={()=>{setSelPlat(p.id);setPrevField(PF[p.id]?.[0]);setImproveOpts([]);}}>
                      <span style={{fontSize:15}}>{p.icon}</span>
                      <div style={{flex:1,minWidth:0}}>
                        <p style={{margin:0,fontSize:12,fontWeight:selPlat===p.id?600:400,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</p>
                        <p style={{margin:0,fontSize:10,color:"#A89880"}}>{p.region} · {p.lang==="es"?"ES":"EN"}</p>
                      </div>
                    </button>
                  ))}
                </div>
              </div>

              {plat&&selPlat!=="mercadolibre"&&(
                <div style={{minWidth:0}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"0.75rem"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:20}}>{curPlat?.icon}</span>
                      <div>
                        <p style={{fontWeight:700,fontSize:14,margin:0}}>{curPlat?.name}</p>
                        <p style={{fontSize:11,color:"#A89880",margin:0}}>{curPlat?.lang==="es"?"Listado en español":"English listing"}</p>
                      </div>
                    </div>
                    <CopyBtn text={fields.map(f=>`=== ${(FL[f]||f).toUpperCase()} ===\n${Array.isArray(plat[f])?plat[f].join("\n"):plat[f]||""}`).join("\n\n")} id="plat-all" big/>
                  </div>

                  <div className="fgroup" style={{marginBottom:"0.75rem"}}>
                    <label>Campo a visualizar</label>
                    <select value={prevField||""} onChange={e=>{setPrevField(e.target.value);setImproveOpts([]);}}>
                      {fields.map(f=><option key={f} value={f}>{FL[f]||f}</option>)}
                    </select>
                  </div>

                  {prevField&&(
                    <div className="card" style={{marginBottom:"1rem"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"0.75rem"}}>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                          <h3>{FL[prevField]||prevField}</h3>
                          {improved[`${selPlat}_${prevField}`]&&<span className="badge badge-improved">✨ mejorado</span>}
                        </div>
                        <CopyBtn text={Array.isArray(getVal(selPlat,prevField))?getVal(selPlat,prevField).join(prevField==="bulletPoints"?"\n":", "):getVal(selPlat,prevField)} id={`${selPlat}-${prevField}`}/>
                      </div>
                      <div className={improved[`${selPlat}_${prevField}`]?"ai-glow":""}>{renderVal(prevField,getVal(selPlat,prevField))}</div>

                      <div style={{marginTop:"1rem",paddingTop:"1rem",borderTop:"1px solid #EDE9E3"}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                          <p style={{fontSize:12,fontWeight:600,color:"#5C3D1E",margin:0}}>✨ Mejorar con IA</p>
                          {improved[`${selPlat}_${prevField}`]&&<button className="btn-ghost" style={{fontSize:11}} onClick={()=>setImproved(p=>{const n={...p};delete n[`${selPlat}_${prevField}`];return n;})}>Revertir</button>}
                        </div>
                        <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:8}}>
                          {IMPROVE_TONES.map(t=>(
                            <button key={t} className={`improve-opt${improveOpts.includes(t)?" sel":""}`} onClick={()=>setImproveOpts(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t])}>{t}</button>
                          ))}
                        </div>
                        <button className="btn-primary" disabled={improving_} onClick={()=>improveField(selPlat,prevField)}>
                          {improving_?"Mejorando…":"✨ Mejorar este campo"}
                        </button>
                      </div>
                    </div>
                  )}

                  <div className="divider"/>
                  <p className="slbl" style={{marginBottom:8}}>Todos los campos</p>
                  <div style={{display:"flex",flexDirection:"column",gap:6}}>
                    {fields.map(f=>{
                      const val=getVal(selPlat,f);
                      if(!val)return null;
                      const prev=Array.isArray(val)?val.slice(0,2).join(", ")+(val.length>2?"…":""):String(val).slice(0,70)+(String(val).length>70?"…":"");
                      return (
                        <button key={f} className={`field-row${prevField===f?" active":""}`} onClick={()=>setPrevField(f)}>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                              <p className="slbl" style={{margin:0}}>{FL[f]||f}</p>
                              {improved[`${selPlat}_${f}`]&&<span className="badge badge-improved" style={{fontSize:10,padding:"1px 7px"}}>✨</span>}
                            </div>
                            <p style={{margin:0,fontSize:12,color:"#8B7355",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{prev}</p>
                          </div>
                          <CopyBtn text={Array.isArray(val)?val.join(", "):val} id={`mini-${f}`} small/>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ── SHOOTS TAB ── */}
          {activeTab==="shoots"&&(
            <div>
              <div className="card-muted" style={{marginBottom:"1.25rem"}}>
                <h3 style={{marginBottom:6}}>Cómo usar estos prompts</h3>
                <p style={{fontSize:13,color:"#5C3D1E",lineHeight:1.65,margin:0}}>
                  Copia cualquier prompt y pégalo en <strong>Midjourney</strong> (escribe <code>/imagine</code> primero), <strong>DALL-E 3</strong> en ChatGPT, o <strong>Adobe Firefly</strong>. Cada prompt usa tus dimensiones, madera y acabado exactos para generar fotos de calidad comercial.
                </p>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:14}}>
                {shoots.map((item,i)=>(
                  <div key={i} className="card">
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,marginBottom:12}}>
                      <div style={{display:"flex",alignItems:"center",gap:12}}>
                        <span style={{fontSize:26}}>{item.style.icon}</span>
                        <div>
                          <h3 style={{marginBottom:2}}>{item.style.label}</h3>
                          <p style={{fontSize:12,color:"#8B7355",margin:0}}>{item.style.desc}</p>
                        </div>
                      </div>
                      <CopyBtn text={item.prompt} id={`shoot-${i}`}/>
                    </div>
                    <div className="prompt-mono">{item.prompt}</div>
                    <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>
                      {["Midjourney","DALL-E 3","Adobe Firefly","Stable Diffusion"].map(tool=>(
                        <span key={tool} style={{fontSize:11,padding:"3px 8px",borderRadius:20,background:"#F5F0EB",border:"1px solid #EDE9E3",color:"#8B7355"}}>{tool}</span>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
              <div style={{textAlign:"right",marginTop:"1rem"}}>
                <CopyBtn text={shoots.map(p=>`=== ${p.style.label.toUpperCase()} ===\n${p.prompt}`).join("\n\n")} id="all-shoots" big/>
              </div>
            </div>
          )}

          {/* ── SEO TAB ── */}
          {activeTab==="seo"&&(
            <div style={{display:"grid",gap:"1rem"}}>
              {["es","en"].map(l=>(
                <div key={l} className="card">
                  <h3 style={{marginBottom:"1rem"}}>{l==="es"?"🇪🇨 Español":"🇺🇸 English"}</h3>
                  <div style={{marginBottom:"1rem"}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                      <p className="slbl" style={{margin:0}}>Título SEO</p>
                      <CopyBtn text={results.seoTitle?.[l]} id={`seo-t-${l}`} small/>
                    </div>
                    <p style={{margin:0,fontSize:13,background:"#F5F0EB",padding:"9px 12px",borderRadius:8}}>{results.seoTitle?.[l]}</p>
                  </div>
                  <div>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                      <p className="slbl" style={{margin:0}}>Palabras clave</p>
                      <CopyBtn text={results.seoKeywords?.[l]?.join(", ")} id={`seo-k-${l}`} small/>
                    </div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                      {results.seoKeywords?.[l]?.map((k,i)=><span key={i} className="tag tag-wood">{k}</span>)}
                    </div>
                  </div>
                </div>
              ))}
              {results.pricingNote&&(
                <div className="card">
                  <p className="slbl" style={{marginBottom:6}}>Justificación de precio premium</p>
                  <p style={{margin:0,fontSize:13,color:"#5C3D1E",lineHeight:1.65}}>{results.pricingNote}</p>
                </div>
              )}
            </div>
          )}

          {/* ── HASHTAGS TAB ── */}
          {activeTab==="hashtags"&&(
            <div style={{display:"grid",gap:"1rem"}}>
              {[{k:"instagram",label:"📸 Instagram",color:"#E1306C"},{k:"tiktok",label:"🎵 TikTok",color:"#333"}].map(sh=>(
                <div key={sh.k} className="card">
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}>
                    <h3>{sh.label}</h3>
                    <CopyBtn text={results.hashtags?.[sh.k]?.join(" ")} id={`hash-${sh.k}`} small/>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                    {results.hashtags?.[sh.k]?.map((h,i)=><span key={i} style={{fontSize:12,padding:"4px 10px",borderRadius:20,background:sh.color+"12",border:`1px solid ${sh.color}33`}}>{h}</span>)}
                  </div>
                </div>
              ))}
              {results.instagramBio&&(
                <div className="card">
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
                    <h3>Bio de Instagram</h3>
                    <CopyBtn text={results.instagramBio} id="bio" small/>
                  </div>
                  <p style={{margin:0,fontSize:13,color:"#5C3D1E",background:"#F5F0EB",padding:"9px 12px",borderRadius:8}}>{results.instagramBio}</p>
                </div>
              )}
            </div>
          )}

          <div style={{textAlign:"center",marginTop:"2.5rem",paddingTop:"1.5rem",borderTop:"1px solid #EDE9E3"}}>
            <button className="btn-ghost" onClick={reset}>+ Crear nuevo listado de producto</button>
          </div>
        </div>
      )}

      {lightbox&&(
        <div className="lightbox" onClick={()=>setLightbox(null)}>
          <img src={lightbox} alt="preview"/>
        </div>
      )}

      <footer className="footer">
        <p>ArtesanoAI · Hecho para artesanos ecuatorianos · <a href="https://console.anthropic.com" target="_blank" rel="noreferrer">Impulsado por Claude AI</a></p>
      </footer>
    </>
  );
}

function StepBar({step}){
  const steps=["upload","details","generating","results"];
  const labels=["Subir fotos","Detalles","Generando","Resultados"];
  const si=steps.indexOf(step);
  return(
    <div className="steps">
      {steps.map((s,i)=>{
        const done=si>i,active=si===i;
        return(
          <React.Fragment key={s}>
            <div className="step-node">
              <div className={`step-dot ${done?"done":active?"active":"idle"}`}>{done?"✓":i+1}</div>
              <span className={`step-lbl${active?" active":""}`}>{labels[i]}</span>
            </div>
            {i<3&&<div className="step-line" style={{background:done?"#8B5E3C":"#EDE9E3"}}/>}
          </React.Fragment>
        );
      })}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
